ar, en üst raftan, kimsenin dokunmadığı bir cildi indirir. Tozunu, bir annenin çocuğunun yüzündeki tozu siler gibi siler."]},{num:2,paragraphs:["O gün, ilk defa bana bir kitap emanet etti. İncecik, kahverengi kapağı atmış, sırtı iplikle dikilmiş bir kitap. Sabahattin Ali'nin 'Değirmen'i. 'Oku,' dedi. 'Ama altını çizme. Kitap, altını çizilmek için değil, içine düşülmek için vardır.'","Ben o kitabı, dükkanın arkasındaki hasır iskemlede, dışarıdan gelen tablacı sesleri arasında okudum. 'Bir kitap, ilk cümlesiyle seni ya içeri alır, ya kapıda bırakır,' demişti babam. Değirmen'in ilk cümlesi beni içeri aldı ve bir daha bırakmadı. O günden sonra, kelimelerin sadece anlamları olmadığını, aynı zamanda ağırlıkları olduğunu öğrendim. Bazı cümleler tüy kadar hafiftir, bazıları ise kurşun gibi çöker insanın göğsüne.","Yaz geldi, geçti. Adana'nın pamuk tozu, kitapların arasına da girerdi. Babam, her akşam dükkanı kapatmadan önce, rafları tek tek silerdi. 'Toz, kitabın en büyük düşmanıdır,' derdi, 'İnsan unutunca tozlanır, kitap okunmayınca.' O zamanlar bu sözün ne demek olduğunu anlamazdım. Unutmak ile tozlanmak arasındaki o gizli akrabalığı yıllar sonra çözecektim."]},{num:3,paragraphs:["Sahaflık, bir ticaret değildir. Bir bekçiliktir. Babam, bunu sık sık tekrarlardı. 'Biz mürekkebin bekçileriyiz, Yusuf. İnsanlar yazıp gidiyor, biz kalanı koruyoruz.' Dükkanına gelenler de hep bekleyenlerdi: bir zamanlar sevdiği kızın adını bir kitabın kenarına yazmış yaşlı adamlar, çocuğunun el yazısını arayan anneler, kendi gençliğinin altını çizdiği satırları bulmaya gelen memurlar. Herkes, kaybettiği bir cümleyi aramaya gelirdi aslında.","Ben büyüdükçe, dükkan daralmaya başladı. Raflar yetmez oldu. Babam, kitapları üst üste yığmaya başladı. Aralarında küçük patikalar açtı. Dükkan, bir labirente dönüştü. Labirentin merkezinde ise ben vardım, okuyarak kaybolan bir çocuk. Lise yıllarında, artık Adana'daki bütün kütüphaneleri tüketmiştim. Bir gün, babamın kasasının arkasından, gazete kağıdına sarılı bir paket çıkardı. 'Bunu sana üniversiteye gittiğinde verecektim, ama şimdi zamanı,' dedi.","Paketin içinde, daktiloyla yazılmış, kenarları yanmış, üç yüz sayfalık bir müsvedde vardı. Üstünde tek bir isim: İhsan Kayıp — Gölge Lügati. 'Bu adam,' dedi babam, sesi kısılarak, 'bir zamanlar bu şehrin en büyük yazarı olacaktı. Sonra sustu.'"]},{num:4,paragraphs:["İhsan Kayıp ismini ilk kez o gün duydum, ama sanki hep biliyormuşum gibi geldi. Müsveddeyi elime aldığımda, parmaklarımın altında kağıdın pürüzlerini hissettim. Daktilo harfleri, bazı yerlerde silik, bazı yerlerde ise kağıdı yırtacak kadar sertti. Yazar, öfkeli anlarında tuşlara daha sert vurmuş olmalıydı. Sayfaların arasında, kurumuş bir limon çiçeği yaprağı duruyordu. Kokladım. Adana hala oradaydı.","O gece, o müsveddeyi sabaha kadar okudum. Gölge Lügati, bir sözlük değildi. Bir adamın, çocukluğundan beri duyduğu kelimelerin gölgelerini topladığı bir romandı. Mesela 'hasret' kelimesi. Yazara göre hasret, bir kelime değil, bir odanın ikindi vakti aldığı ışıktı. 'Vuslat' ise, uzun bir yolculuktan sonra giyilen ilk terliğin sesiydi. Roman, kelimeleri tarif etmiyor, onları hatırlatıyordu.","Fakat roman yarım kalmıştı. Son sayfada, cümle ortasında bitiyordu. Şöyle diyordu: 'Ve böylece, anladım ki bütün lügatler eksiktir, çünkü...' Çünkü'den sonra boşluk. Üç nokta değil, bembeyaz bir boşluk. Sanki yazar, o kelimenin devamını bulmak için ayağa kalkmış ve bir daha masasına hiç dönmemiş gibiydi."]},{num:5,paragraphs:["Ertesi sabah babama sordum, 'Sonu nerede?' Babam omuz silkti. 'Kimse bilmiyor. İhsan Kayıp, 1971'de İstanbul'a gitti, Büyükada'ya yerleşti ve yazmayı bıraktı. O son cümleyi otuz yıldır kimse bulamadı. Bazıları, bilerek bitirmediğini söyler.'","Bilerek bitirmemek... Bu fikir, sekiz yaşındaki çocuğun kağıt kokusuyla kurduğu o saf ilişkiyi ilk kez sarstı. Bir yazar, neden bir cümleyi yarım bırakır? Bu bir acizlik miydi, yoksa en büyük ustalık mı? Edebiyat, tamamlanmak için mi yazılırdı, yoksa tamamlanamayacağını göstermek için mi?","O müsvedde, benim muskam oldu. Liseyi bitirip İstanbul Üniversitesi Türk Dili ve Edebiyatı'nı kazandığımda, bavulumda üç şey vardı: bir fotoğraf, bir tesbih ve Gölge Lügati'nin o yanık kenarlı kopyası. Adana'dan İstanbul'a giden otobüs, Torosları aşarken, ben camdan dışarı bakıp tek bir şeyi düşünüyordum: O boşluğu doldurmak."]},{num:6,paragraphs:["İstanbul, Adana gibi kokmuyordu. Adana, pamuk, toprak ve ter kokardı; dürüst bir kokuydu. İstanbul ise, ıslak taş, mazot ve yosun kokuyordu; sürekli bir şey saklayan bir koku. Beyazıt'taki fakülte binası, babamın sahafından çok daha büyük, ama çok daha az kitap kokuyordu. Orada kitaplar, raflarda değil, insanların kafalarında duruyordu.","İlk ders, Prof. Dr. Nezihe Aras'ın 'Modern Türk Romanında Eksilti' dersiydi. Sınıf kalabalık, tahta tozlu. Hoca, elinde tebeşir, 'Bir roman nasıl biter?' diye sordu. Herkes sustu. 'Mutlu sonla, kötü sonla, ölümle...' diye cevaplar geldi. Hoca başını salladı. 'Hayır,' dedi, 'Bir roman, sustuğu yerde biter.' O an, çantamdaki müsveddenin ağırlığını hissettim.","Ders çıkışında yanına gittim. Titreyen ellerle Gölge Lügati'ni gösterdim. Gözleri büyüdü. 'Sen... sen bunu nereden buldun? İhsan benim hocamdı. Bu müsveddeyi yaktı sanıyorduk.' Meğer İhsan Kayıp, 1960'ların sonunda fakültenin en parlak asistanıymış. Sonra bir gün, 'kelimeler tükendi' deyip istifa etmiş. 'O son cümle...' dedi Nezihe Hanım, 'O, edebiyatımızın en büyük sırrıdır. Kimse o boşluğun ne olduğunu bilmiyor. Çünkü o boşluk, hepimizin içindeki boşluktur.'"]},{num:7,paragraphs:["O günden sonra takıntım başladı. Kütüphaneler, arşivler, eski dergiler. İhsan Kayıp hakkında yazılmış her şeyi okudum. 1965'te Yeni Dergi'de yayımlanmış üç öyküsü, 1968'de verdiği bir söyleşi, bir de 1970'te hakkında yazılmış zehir zemberek bir eleştiri: 'Kayıp, kalemini kaybetmiştir.' Hepsi bu kadar. Sonra sessizlik. Otuz yıllık, mutlak bir sessizlik.","Sahafları dolaşmaya başladım. Babamın bana öğrettiği gibi, koklayarak. Beyazıt, Cağaloğlu, Aslıhan Pasajı... Her sahafta aynı soru: 'İhsan Kayıp'ın devamı var mı sizde?' Çoğu, adını bile hatırlamıyordu. Bir gün, Müteferrika'da, kamburu çıkmış, gözleri görmeyen bir sahaf, elimi tuttu. 'Evlat,' dedi, 'Sen son cümleyi arıyorsun, değil mi? Boşuna arama. O cümle yazılmadı. Çünkü yazılsaydı, roman biterdi. Roman bitseydi, yazar da biterdi. O, bitmemek için sustu.'","Bu söz, beni hem rahatlattı, hem de daha çok huzursuz etti. Bitmemek için susmak... Ne asil, ne korkunç bir fikir. Edebiyat tarihi, bitmemek için susanlarla dolu muydu? Rimbaud, Afrika'ya gitmişti. Bartleby, 'yapmamayı tercih ederim' demişti. İhsan Kayıp da, 'yazmamayı tercih ederim' diyenlerden miydi?"]},{num:8,paragraphs:["Üçüncü sınıfa geldiğimde, artık derslere girmiyordum. Bütün vaktimi Büyükada vapurunu bekleyerek geçiriyordum. İhsan Kayıp'ın Büyükada'da, Fayton Meydanı'nın arkasında, harap bir Rum köşkünde yaşadığı söyleniyordu. Adresi bulmuştum, ama gitmeye cesaret edemiyordum. Ya kapıyı açmazsa? Ya açar da, 'O cümle yok' derse? O zaman ne yapacaktım? Benim bütün hikayem, olmayan bir cümleye dayanıyordu.","Bir sonbahar günü, cesaretimi topladım. Vapur, Marmara'nın o kurşuni sularını yararak ilerlerken, ben elimdeki müsveddeye bakıyordum. Martılar, sanki benim için ağlıyordu. Ada'ya ayak bastığımda, hava birden değişti. İstanbul'un mazot kokusu gitmiş, yerini çam ve yosun kokusuna bırakmıştı. Faytonlar, atların nal sesleri... Zaman, burada daha yavaş akıyordu. Belki de İhsan Kayıp, bu yüzden buraya kaçmıştı. Zamanın yavaş aktığı bir yerde, cümleler de yavaş biterdi.","Köşkü buldum. Duvarları sarmaşıklarla kaplı, pencerelerinin çoğu kırık, bahçesi yabani otlarla dolu, iki katlı ahşap bir köşk. Kapısında paslı bir tokmak. Vurdum. Ses gelmedi. Bir daha vurdum. İçeriden, önce bir öksürük, sonra sürünen ayak sesleri geldi. Kapı aralandı."]},{num:9,paragraphs:["Karşımda, seksen yaşlarında, bembeyaz saçlı, sırtı bükülmüş, ama gözleri hala genç bir adam duruyordu. İhsan Kayıp. Onu hemen tanıdım. Arkasındaki odada, devasa bir kütüphane, ortada bir daktilo ve etrafa saçılmış kağıtlar vardı. Oda, babamın sahafı gibi kokuyordu. Kağıt, toz ve biraz da limon kolonyası.","'Kimsin?' dedi. Sesi, yıllardır kullanılmayan bir daktilonun ilk tuşu gibi, biraz tutuk, biraz paslıydı.","'Ben... ben Yusuf. Adana'dan. Halil'in oğlu. Sahaf Halil'in.'","Gözleri doldu. 'Halil... Halil yaşıyor mu?'","'Yaşıyor. Sizi soruyor.' Yalan söyledim. Babam, İhsan Kayıp'ı hiç sormamıştı. Ama o an, yalan söylemem gerektiğini hissettim.","Beni içeri aldı. Daktilonun başına oturdu. Daktilo, Olympia marka, siyah, tuşlarının üstündeki harfler silinmiş bir emektar. 'Otur,' dedi. 'Çay koyayım. Adanalı çayı sever.'"]},{num:10,paragraphs:["Çay, ince belli bardakta, yanında bir tabak pötibör bisküviyle geldi. Karşılıklı oturduk. Uzun süre sustuk. Sessizlik, bu evde bir misafir gibi ağırlanıyordu. Sonra ben, titreyen ellerimle çantamdan müsveddeyi çıkardım. Masanın üstüne koydum.","İhsan Kayıp, müsveddeye bakmadı bile. Gözlerini kapadı. 'Onu yakacaktım,' dedi. 'Bütün kopyalarını yaktım. Baban nasıl bulmuş?'","'Bilmiyorum. Bana verdi. Son cümlesi eksik.'","Güldü. Dişleri sararmış, ama gülüşü gençti. 'Eksik değil, evlat. Tam da olması gerektiği gibi. O boşluk, romanın son cümlesidir.'","Anlamadım. 'Ama... çünkü'den sonrası yok.'","'Çünkü...' dedi, çayından bir yudum alarak, 'Çünkü cümle biterse, her şey biter. İnsan, en çok yarım kalan cümleyi hatırlar. Tamamlanan cümle unutulur. Ben unutulmak istemedim.'","Bu, o güne kadar duyduğum en bencil ve en dürüst cümleydi."]},{num:11,chapter:"Bölüm II",chapterTitle:"Yarım Kalan Roman",isChapterStart:!0,paragraphs:["İhsan Kayıp'ın evinde geçirdiğim ilk akşam, bana edebiyat tarihini yeniden yazdırdı. Adam, otuz yıldır konuşmuyordu, ama sustuğu her gün, aslında konuşmuştu. Bana anlattı: 1969'da, Gölge Lügati'nin sonlarına doğru, bir sabah daktilosunun başına oturmuş ve birdenbire kelimelerin anlamını yitirdiğini fark etmiş. 'Kelime, hasret,' demiş kendi kendine. 'Hasret ne demek?' Sözlüğe bakmış. Sözlük, 'özlem' demiş. 'Özlem ne demek?' diye sormuş. Sözlük yine dönüp dolaşıp aynı yere gelmiş. Kelimeler, birbirini tarif etmekten başka bir işe yaramıyormuş. Bir yılan, kendi kuyruğunu yiyormuş.","O gün, daktilosunu kapatmış. 'Eğer kelimeler birbirini tarif ediyorsa, ben neyi anlatıyorum?' diye düşünmüş. 'Ben, kelimelerle kelimelerin yetersizliğini anlatmaya çalışıyorum. Bu bir ihanet.' Ve o ihaneti durdurmak için susmuş. 'Yarım kalan roman, tamamlanandan daha dürüsttür,' demiş. 'Çünkü hayat da yarım kalır. Hiçbir hayat, son cümlesini kendisi yazamaz.'","Onu dinlerken, babamın dükkanındaki o tozlu rafları düşündüm. Oradaki her kitap, bir hayatın yarım kalmışlığının kanıtıydı. Kimse, okuduğu kitabı sonuna kadar anlamazdı. Herkes, bir yerinde bırakır, sonra dönerdi. Dönmek, aslında bitirmemekti."]},{num:12,paragraphs:["İhsan Kayıp, o gece bana defterlerini gösterdi. Onlarca defter, her biri farklı renklerde, farklı ebatlarda. Hepsinin ilk sayfasında aynı cümle: 'Bugün de yazamadım.' Altında tarih. 1972, 1973, 1974... Ta 2001'e kadar. Her gün, yazamadığını yazmış. Bu, en büyük paradoks, en büyük edebiyattı. Yazamadığını yazmak, yazmanın ta kendisi değil miydi?","Defterlerden birini açtım. 1984 tarihli. Şöyle yazıyordu: 'Bugün Büyükada'da bir çocuk gördüm. Elinde bir uçurtma vardı. Uçurtma, rüzgarda değil, çocuğun koşmasında uçuyordu. Anladım ki, kelimeler de böyledir. Kendi başına uçmaz, birinin onu koşturması gerekir. Ben artık koşamıyorum.'","Başka bir defter, 1991: 'Halil'e mektup yazdım, göndermedim. Adana'da portakal çiçekleri açmıştır şimdi. Orada kelimeler hala kokar. Burada, sadece küf kokuyor.' Babamın adını görünce irkildim. Demek mektuplaşmışlardı bir zamanlar. Babam bana hiç bahsetmemişti.","Sabaha karşı, İhsan Kayıp uyuyakaldı koltuğunda. Ben, onun horultuları arasında, defterleri okumaya devam ettim. Her defter, bitmemiş bir romanın notlarıydı. Ve ben, yavaş yavaş anlıyordum ki, aradığım son cümle, bu defterlerin hiçbirinde yoktu. Çünkü son cümle, bir cümle değildi. Bir karardı."]},{num:13,paragraphs:["Ertesi gün Ada'dan ayrılırken, İhsan Kayıp bana bir şey verdi. Küçük, sarı bir zarf. 'Açma,' dedi. 'Adana'ya dönünce aç.'","Vapurda zarfı elimde evirip çevirdim. Açmamak için kendimi zor tuttum. İstanbul'a döndüğümde, doğruca Beyazıt'a gittim. Nezihe Hoca'ya her şeyi anlattım. Dinledi, uzun uzun sustu. Sonra, 'Yusuf,' dedi, 'Sen İhsan'ın son cümlesini aramıyorsun. Sen kendi ilk cümleni arıyorsun. Bunu anladığında, o zarfı açacaksın.'","O gece yurtta uyuyamadım. İlk cümle... Bir romanın ilk cümlesi, bir hayatın ilk nefesi gibidir. Yanlış alırsan, bütün hikaye yanlış gider. Benim ilk cümlem ne olabilirdi? 'Babamın sahaf dükkanında büyüdüm.' Çok basit. 'Adana sıcağında, kitaplar arasında...' Çok edebi, çok yapmacık. Hiçbiri olmuyordu.","Günler geçti. Ben, İhsan Kayıp'ın defterlerindeki o 'Bugün de yazamadım' cümlesini düşünmeye başladım. Belki de en dürüst ilk cümle buydu. 'Bugün de yazamadım.' Sonra devamı gelirdi. Ama ne?"]},{num:14,paragraphs:["Final haftası geldi. Ben, sınavlara girmedim. Kütüphanede, Gölge Lügati'nin fotokopisini çoğalttım. Altına kendi notlarımı ekledim. Kenar boşluklarına, babamın dükkanındaki gibi, küçük resimler çizdim. Bir çay bardağı, bir toz zerresi, bir limon çiçeği. Sonra o çoğalttığım nüshayı, fakültenin panosuna astım. Üstüne bir not yazdım: 'Bu romanı tamamlayacak bir okur aranıyor. Son cümlesi kayıptır. Bulan, kendine saklasın.'","Ertesi gün, pano boştu. Biri almıştı. Kim olduğunu hiç öğrenemedim. Belki de en iyisi buydu. Edebiyat, bazen böyle elden ele geçer. Birinin yarım bıraktığını, bir başkası tamamlar, ama tamamladığını söylemez. Sessiz bir anlaşmadır bu.","Sömestr tatili geldi. Adana'ya dönmeye karar verdim. Otobüs bileti aldım. Zarf hala çantamdaydı, kapalı. Otobüs, yine Torosları aşarken, bu sefer İstanbul'u değil, Adana'yı düşünüyordum. Babamın dükkanı duruyor muydu acaba? Raflar tozlanmış mıydı?"]},{num:15,paragraphs:["Adana'ya vardığımda, şehir değişmişti. Küçük Saat'in etrafı, dev binalarla dolmuştu. Babamın sokağına girdim. Dükkan... yerinde yoktu. Yerinde, bir cep telefonu dükkanı vardı. İçeride, ışıl ışıl telefonlar. Tabelada, 'Halil İletişim' yazıyordu. Babam, sahaflığı bırakıp telefoncu olmuştu.","İçeri girdim. Babam, tezgahın arkasında, gözlüğü gözünde, bir telefonun ekranına bakıyordu. Beni görünce ayağa kalktı. Sarıldık. 'Baba, dükkan?' dedim. Elini salladı. 'Bitti, oğlum. Kimse kitap almıyor artık. Herkes telefona bakıyor. Ben de telefona bakar oldum. Ekmek parası.'","O an, İhsan Kayıp'ın sözünü hatırladım: 'Roman bitseydi, yazar da biterdi.' Babamın romanı bitmişti. Sahaf dükkanı, onun romanıydı. Bitince, o da başka bir romana başlamıştı. Telefon romanına.","Eve gittik. Annem, tarhana çorbası yapmıştı. Kokusu, bütün evi sarmıştı. O gece, babamın eski kitaplarından kalan birkaç koli arasında yattım. Kolilerden birinden, o limon çiçeği kokusu geliyordu. Uyuyamadım."]},{num:16,paragraphs:["Sabah, o sarı zarfı açtım. İçinden tek bir kağıt çıktı. Daktiloyla yazılmış, tek bir cümle: 'Sevgili Halil, oğlun gelirse ona söyle, son cümle yoktur, sadece ilk koku vardır.'","Ağlamaya başladım. Hıçkıra hıçkıra. Çünkü anlamıştım. İhsan Kayıp, bu notu yıllar önce yazmıştı. Babam biliyordu. Her şeyi biliyordu. Beni, o son cümleyi aramam için İstanbul'a gönderen de oydu. Çünkü biliyordu ki, ben o cümleyi ararken, kendi cümlemi bulacaktım.","Babam içeri girdi. Elinde iki bardak çay. 'Ağlama,' dedi. 'Kitap dediğin, ağlamak için değil, anlamak içindir. Sen anladın mı?'","'Neyi?'","'Kağıt kokusunu. İlk kokuyu.'","O gün, babamla birlikte, kalan kitap kolilerini açtık. Her kitabı tek tek kokladık. O koku, 1974'teki o ilk günkü gibiydi. Hiç değişmemişti. Değişen, sadece bendim."]},{num:17,paragraphs:["Adana'da bir ay kaldım. Her gün, eski sahaf dostlarını ziyaret ettim. Hepsi, başka işler yapıyordu. Biri kebapçı olmuş, biri emlakçı. Hepsi, kitap kokusunu özlüyordu. Bir akşam, onlarla birlikte, eski dükkanın önünde oturduk. Çay içtik. 'Bir zamanlar,' dedi içlerinden biri, 'burada bir cümle arardık, şimdi fiyat soruyoruz.'","İstanbul'a dönme vaktim gelmişti. Dönmeden önce, babamın bana verdiği o ilk kitabı, Değirmen'i, tekrar okudum. Bu sefer, altını çizerek. Çünkü artık biliyordum ki, bir kitabı sevmek, onu kirletmeyi göze almaktır. Altını çizmek, 'ben buradaydım' demektir. Tıpkı bir duvara isim kazımak gibi.","Kitabın son sayfasına, babamın dükkanının tarifini yazdım. Kokusu, tozu, çay bardağının çınlaması... Sonra altına ekledim: 'Bu hikaye burada bitmedi, çünkü hiç başlamadı. Başlayan her hikaye, zaten hep vardı.'"]},{num:18,paragraphs:["İstanbul'a döndüğümde, fakülteye gitmedim. Doğruca Beyazıt Sahaflar Çarşısı'na gittim. Orada, küçücük bir dükkan kiraladım. Adını koydum: 'Mürekkep Bekçisi'. Tabelasını, babamın eski tabelacısına yaptırdım. Ahşap, el yazması.","Dükkanı, babamın dükkanı gibi dizdim. Raflar, tavana kadar kitap. Ortada hasır iskemle. Ve bir kasa. Kasanın arkasına, Gölge Lügati'nin o müsveddesini koydum. Gelen her müşteriye, 'Bir son cümle arar mısın?' diye soruyordum. Çoğu gülüp geçiyordu. Ama bazıları duruyordu. Durup, o boşluğa bakıyordu.","Bir gün, genç bir kız geldi. Üniversiteli. Elinde bir defter. 'Ben tamamladım,' dedi. 'Son cümleyi.' Defteri uzattı. Açtım. Son sayfada, o 'çünkü...' den sonrası doldurulmuştu: '...çünkü bütün lügatler eksiktir, çünkü insan, eksik olanı sever.'","Güzel bir cümleydi. Ama benim aradığım cümle değildi. Kızın gözlerine baktım. 'Güzel,' dedim, 'Ama eksik. Biraz daha beklemelisin.'"]},{num:19,paragraphs:["Dükkan, yavaş yavaş dolmaya başladı. İnsanlar, kitap almaya değil, koku almaya geliyordu. Bir köşede, bir adam, saatlerce bir kitabı koklayarak oturuyordu. Bir kadın, çocuğuna kitap okuyordu. Bir yaşlı amca, her gün gelip aynı gazetenin aynı sayfasını okuyordu. Hepsi, bir şeyi bekliyordu.","Ben de bekliyordum. Ne beklediğimi bilmiyordum, ama bekliyordum. Belki de edebiyat, beklemekti. Bir cümlenin gelmesini beklemek, bir okurun gelmesini beklemek, bir kokunun geri gelmesini beklemek.","Bir akşam, dükkanı kapatırken, kapının altından bir zarf atıldığını gördüm. Üstünde isim yoktu. Açtım. İçinden, daktiloyla yazılmış tek bir sayfa çıktı. İhsan Kayıp'tan geliyordu. Şöyle yazıyordu: 'Yusuf, dükkanını duydum. Bekçi olmuşsun. Aferin. Ben ölüyorum. Doktorlar üç ay verdi. Sana son defterimi gönderiyorum. Onu yakma. Oku. Ama bitirme.'"]},{num:20,paragraphs:["Bir hafta sonra, kargoyla defter geldi. Siyah kaplı, kalın bir defter. İlk sayfasında, yine o cümle: 'Bugün de yazamadım.' Ama bu sefer, altında devamı vardı: 'Bugün de yazamadım, çünkü yazmak, ölmek demek. Ben ölmek istemiyorum. O yüzden yazmıyorum. Yazmadığım her gün, biraz daha yaşıyorum.'","Defteri okumaya başladım. Bu defter, diğerlerinden farklıydı. Bu defter, bir veda mektubuydu. İhsan Kayıp, bütün hayatını, yazmadığı romanın gölgesinde nasıl geçirdiğini anlatıyordu. Büyükada'da, o köşkte, her sabah daktilosunun başına oturup, tek bir harfe basmadan kalkışını. Dışarıda çocukların sesini dinleyişini. Çayının soğuyuşunu. Ve en çok da, Adana'yı özleyişini.","'Adana'yı özlüyorum,' diye yazmıştı bir sayfada. 'Orada, kelimeler hala topraktan çıkıyor. Burada, kelimeler duvardan çıkıyor. Duvar, toprak değildir. Toprak, kelimeyi besler, duvar ise onu hapseder. Ben hapisteyim, Yusuf. Beni kurtar.'","O gece, Büyükada'ya gitmeye karar verdim. Son kez."]},{num:21,chapter:"Bölüm III",chapterTitle:"Silinen Satırlar",isChapterStart:!0,paragraphs:["Büyükada, kışın başka bir yerdir. Yazın o cıvıl cıvıl faytonlar, yerini sessizliğe bırakır. Deniz, kurşuni değil, siyahtır. Köşk, daha da harap görünüyordu. Kapıyı çaldım. Bu sefer, kimse açmadı. Kapı, zaten aralıktı. İçeri girdim.","İçerisi buz gibiydi. Sobası sönmüştü. İhsan Kayıp, koltuğunda oturuyordu, üstünde bir battaniye. Gözleri kapalı. Uyuyor sandım, ama değildi. Elini tuttum. Soğuktu. Masanın üstünde, daktilo, ve daktiloda yarım kalmış bir kağıt vardı. Kağıtta tek bir cümle: 'Ve böylece, anladım ki...'","Yine aynı cümle. Yine yarım. Demek, son nefesine kadar o cümleyi tamamlamaya çalışmıştı. Ve yine tamamlayamamıştı. Ya da tamamlamak istememişti. Yanına oturdum. Elindeki defteri aldım. Son sayfası açıktı. Şöyle yazıyordu: 'Son cümle, yazılmayan cümledir. Yazılmadığı için, herkes onu kendi içinde tamamlar. Benim son cümlem, senin ilk cümlen olsun, Yusuf.'","Ağlamadım. Çünkü o an, ölümün de bir noktalama işareti olduğunu anladım. Nokta değil, üç nokta. Çünkü ölümle biten hiçbir hikaye, gerçekten bitmez. Anlatılmaya devam eder."]},{num:22,paragraphs:["Cenazesini, Adalılar kaldırdı. Küçük, sessiz bir cenaze. İmam, adını yanlış söyledi. 'İhsan Kayıp' yerine 'İhsan Kayıt' dedi. Güldüm. Kayıp ile kayıt arasında bir harf farkı vardı. Bir harf, bir hayat farkı. Kayıp olan, kayıt altına alınmayandı. O, kayıp kalmayı seçmişti.","Mezar taşına, isteği üzerine hiçbir şey yazılmadı. Sadece bir boşluk bırakıldı. Gelenler, o boşluğa bakıp, kendi cümlelerini fısıldıyordu. Ben de fısıldadım: 'Kağıt kokusu.'","İstanbul'a döndüğümde, dükkanımın kapısında bir kalabalık vardı. Nezihe Hoca, öğrencileri, sahaflar... Hepsi duymuştu. İçeri girdik. Daktilosunu, o Olympia'yı, dükkanın ortasına koydum. 'Bu,' dedim, 'İhsan Kayıp'ın daktilosu. Artık burada duracak. İsteyen, bir tuşuna basabilir. Ama sadece bir tuşuna. Bir harf. Herkes, son cümleye bir harf ekleyecek.'","İnsanlar sıraya girdi. Herkes bir harfe bastı. Kimisi 'a'ya, kimisi 'n'ye. Daktilonun şeridi bitmişti, kağıda iz çıkmıyordu. Ama ses çıkıyordu. Tak... Tak... Tak... Her tak sesi, bir harf, bir nefes, bir hatıra."]},{num:23,paragraphs:["O günden sonra, dükkanın adı değişti. Artık 'Mürekkep Bekçisi' değil, 'Son Cümle'ydi. İnsanlar, oraya son cümlelerini bırakmaya geliyordu. Bir defter koydum ortaya. Üstünde yazıyordu: 'Yarım kalan cümlenizi buraya yazın.' Defter, kısa sürede doldu. Herkes bir şey yarım bırakmıştı: bir aşkı, bir kavgayı, bir vedayı.","Bir kadın yazmıştı: 'Sana söyleyemedim ki...' Bir çocuk: 'Anne, ben aslında...' Bir yaşlı adam: 'Keşke o gün...' Hepsi, o 'çünkü...' den sonrasını arıyordu. Hepimiz, aynı boşluğu doldurmaya çalışıyorduk.","Ben ise, İhsan Kayıp'ın defterlerini temize çekmeye başladım. Daktiloyla. Her gün bir sayfa. Yavaş yavaş. Çünkü acele edersem, kelimeler yine anlamını yitirecekti. Kelimeler, yavaş sevilmek ister. Tıpkı insanlar gibi.","Bir akşam, defterlerden birinde, babamla ilgili bir satır buldum: 'Halil, bana bir gün dedi ki, en iyi kitap, kokusu en uzun kalan kitaptır. Haklıymış. Ben, Adana'daki o dükkanın kokusunu otuz yıldır unutamadım.'"]},{num:24,paragraphs:["Babamı aradım. 'Baba, İhsan Kayıp öldü,' dedim.","Uzun bir sessizlik oldu telefonda. Sonra, 'Biliyorum,' dedi. 'Hissettim. Dün gece, rüyamda dükkanın kokusunu aldım. Demek o yüzdenmiş. O koku, onun kokusuydu.'","Babam, Adana'dan İstanbul'a geldi cenazeden sonra. Dükkanımı gördü. Ağladı. 'Aferin, oğlum,' dedi. 'Bekçi olmuşsun. Ben beceremedim, sen becerdin.'","Birlikte, dükkanın arkasında oturduk. Çay içtik. Babam, cebinden küçük bir şişe çıkardı. Limon kolonyası. Ellerine döktü, sonra bana uzattı. 'Kokla,' dedi. 'Bu, Adana'nın kolonyası. Portakal çiçeği. İhsan bunu çok severdi. Her mektubuna dökerdi.'","Anladım ki, mektuplar hiç bitmemişti. Sadece, zarf değiştirmişti. Kelimeler, kolonyanın içinde yaşamaya devam ediyordu."]},{num:25,paragraphs:["İhsan Kayıp'ın ölümünden sonra, Gölge Lügati birdenbire meşhur oldu. Yayınevleri peşime düştü. 'Müsveddeyi ver, basalım, son cümleyi biz tamamlayalım,' dediler. Kabul etmedim. Çünkü biliyordum ki, o roman basılırsa, ölecekti. Yarım kaldığı için yaşıyordu.","Bir yayınevi ısrar etti. 'Son cümleyi sen yaz,' dedi. 'Ne olacak, bir cümle.' Güldüm. 'Bir cümle, bazen bir ömür eder,' dedim. 'Ben ömrümü satamam.'","O günlerde, dükkana bir adam geldi. Eski bir istihbaratçı olduğunu söyledi. 'İhsan Kayıp, aslında yazmayı bırakmadı,' dedi. 'Yazdırılmadı. 1971'de, bir yazısı yüzünden...' Sustu. 'Neyse, sen anladın.' Anlamıştım. O yıllarda, birçok yazar susmuştu. Kimi korkudan, kimi yasakdan, kimi de inattan. İhsan Kayıp, belki de susarak direnenlerdendi. Susmak da bir yazı biçimiydi.","Bu ihtimal, hikayeyi daha da hüzünlü kılıyordu. Bir yazar, yazamadığı için değil, yazdırılmadığı için susmuşsa, o suskunluk, en gürültülü çığlıktı."]},{num:26,paragraphs:["Kış bitti, bahar geldi. Dükkanım, artık Beyazıt'ın en kalabalık sahaflarından biriydi. Ama ben, kitap satmıyordum. Kitap dinliyordum. Gelen her kitap, bir hikaye anlatıyordu. Kimin okuduğunu, kimin altını çizdiğini, kimin arasına bir otobüs bileti koyduğunu.","Bir gün, eski bir baskı 'Tutunamayanlar' geldi. İçinde, bir not: 'Bu kitabı 1977'de aldım, hala bitiremedim. Bitirememekten utanıyorum. Ama belki de bitirmemek, tutunamamak demektir. Ve ben, tutunamayanları severim.' Altında imza yoktu. Notu, defterime koydum.","Notlar biriktikçe, anladım ki, edebiyat dediğimiz şey, yazarın yazdığı değil, okurun yazamadığıdır. Yazar bir cümle yazar, okur bin cümle hisseder. Hissettiği bin cümleden birini bile yazamaz. O yazılamayan bin cümle, edebiyatın asıl gövdesidir. Biz, sadece, buzdağının görünen küçük kısmını okuyoruz.","Bu düşünce, beni rahatlattı. Artık son cümleyi aramıyordum. Çünkü her okurun, kendi son cümlesi vardı. Ve o cümle, başkasınınkinden daha değerli değildi."]},{num:27,paragraphs:["Bir gün, Nezihe Hoca dükkana geldi. Elinde bir dosya. 'Bunu buldum,' dedi. 'İhsan'ın 1969'da verdiği bir dilekçe. Fakülteden istifa dilekçesi. Gerekçesi: Kelimeler, artık beni taşımıyor. Ben de onları taşımak istemiyorum.'","Dilekçenin altında, küçük bir not: 'Bir gün, bir öğrenci gelip son cümleyi sorarsa, ona deyin ki, son cümle, ilk günkü kağıt kokusundadır.'","Donakaldım. Bu not, benim için yazılmıştı. Yıllar öncesinden. İhsan Kayıp, benim geleceğimi bilmişti. Ya da her öğrencinin geleceğini. Çünkü her öğrenci, bir gün son cümleyi sorar. Ve her hoca, aynı cevabı verir: Başa dön.","Nezihe Hoca gitti. Ben, dükkanın ortasında, o dilekçeyle kala kaldım. Dışarıda, ezan okunuyordu. Beyazıt Camii'nden gelen ses, kitapların arasına giriyor, toz zerreciklerini titretiyordu. O titreşim, bir cümle gibiydi. Görünmeyen, ama hissedilen."]},{num:28,paragraphs:["O akşam, yıllar sonra ilk defa, kendim için yazmaya oturdum. Daktilo değil, kalemle. Çünkü kalem, daha yavaş. Daha insani. Defterimi açtım. İlk sayfasına, babamın bana öğrettiği gibi, tarih attım. 2004. Sonra yazdım: 'Bugün de yazamadım.'","Güldüm. İhsan Kayıp gibi başlamıştım. Sonra devam ettim: 'Bugün de yazamadım, çünkü kağıt kokusu burnumda. Adana'dan gelen bir rüzgar, dükkanın kapısını araladı. İçeri, portakal çiçeği kokusuyla birlikte, sekiz yaşında bir çocuk girdi. Elinde Değirmen vardı. Bana baktı ve dedi ki...'","Durdum. Çocuk ne demişti? Hatırlamaya çalıştım. O çocuk bendim. Sekiz yaşındaki ben. Ne demişti? Hatırladım. Babamın sesi kulaklarımda çınladı: 'Oku, ama altını çizme.'","Yazdım: '...dedi ki, oku ama altını çizme. Çünkü kitap, altını çizilmek için değil, içine düşülmek için vardır.'","İlk paragrafım bitmişti. İlk defa, bir cümleyi bitirmenin ne kadar zor, ne kadar hafifletici olduğunu hissettim."]},{num:29,paragraphs:["Yazmak, bir bekçiliktir aslında. Kelimelerin bekçiliği. Onların kaybolmaması için, gece gündüz başında beklemek. Tıpkı babamın kitapların başında beklediği gibi. Tıpkı İhsan Kayıp'ın yazamadıklarının başında beklediği gibi. Ben de bekçi olmuştum. Mürekkebin bekçisi.","Ertesi gün, dükkanın kapısına bir not astım: 'Bugün kapalıyız. Yazıyoruz.' İçeride, sabahtan akşama kadar yazdım. Adana'yı, babamı, İhsan Kayıp'ı, o yarım kalan cümleyi, o boşluğu, o kokuyu... Hepsini yazdım. Yazdıkça, hafifledim. Yazdıkça, çoğaldım.","Akşam olduğunda, on sayfa yazmıştım. On sayfa, benim için bir romandı. Çünkü ben, hiçbir zaman elli sayfa yazamam sanıyordum. Meğer yazmak, sayfa saymak değilmiş. Bir cümleyi, doğru yere koymakmış.","O on sayfayı, babama gönderdim. Altına not düştüm: 'Baba, ben de bekçi oldum. Ama senin gibi değil, kağıt bekçisi değil, koku bekçisi. Adana'nın kokusunu bekliyorum burada.'"]},{num:30,paragraphs:["Babam, bir hafta sonra cevap yazdı. Mektup, el yazısıyla, titrek bir yazıyla yazılmıştı: 'Oğlum, mektubunu aldım. Ağladım. Ben ömrümde, bir kitabın kokusunu beklemekten başka bir şey yapmadım. Şimdi sen de yapıyorsun. Demek ki, bekçilik babadan oğula geçermiş. Dükkanı kapattım, ama kokusu kaldı. Kokusu, sende kalmış. Ona iyi bak.'","Mektubun içinde, küçük bir kese vardı. Açtım. İçinden, kurumuş portakal çiçekleri döküldü. Kokladım. Adana, avucumun içindeydi.","O günden sonra, yazmak, benim için bir ibadete dönüştü. Her sabah, dükkanı açmadan önce, bir sayfa yazıyordum. Kime yazdığımı bilmiyordum. Belki İhsan Kayıp'a, belki babama, belki sekiz yaşındaki kendime. Ama yazıyordum. Çünkü yazmadığım zaman, eksik kalıyordum.","Ve bir gün, anladım ki, o eksiklik, o boşluk, aslında yazmanın kendisiydi. Boşluk olmasa, kelime olmazdı. Sessizlik olmasa, ses olmazdı. Yarım kalan cümle olmasa, roman olmazdı."]},{num:31,chapter:"Bölüm IV",chapterTitle:"Başkalarının Hikayeleri",isChapterStart:!0,paragraphs:["Dükkanımda biriktirdiğim notlar, artık bir kitabı dolduracak kadar olmuştu. İnsanların kitaplara yazdığı marjinal notlar, altını çizdiği satırlar, arasına koyduğu biletler, fotoğraflar... Hepsi, başka bir romanın malzemesiydi. Ben, başkalarının hikayelerini topluyordum.","Bir gün, 1962 basımı bir 'Kürk Mantolu Madonna' geldi. Sayfa 87'de, bir kadın el yazısıyla şunu yazmıştı: 'Raif, dönmeyeceğim. Biliyorum, bu kitabı bir daha okuyacaksın ve bu satırı göreceksin. Ben dönmeyeceğim. Çünkü sen, kitaplardaki gibi değilsin. Kitaplardaki adamlar susar, sen ise hep konuşuyorsun. — S.'","O notu okuduğumda, elim titredi. Bu, bir romanın içindeki bir roman, bir hayatın içindeki bir hayattı. S. kimdi? Raif kimdi? Neden dönmeyecekti? Bu soruların cevabı yoktu. Ama o cevap yokluğu, notu daha da değerli kılıyordu. Çünkü edebiyat, cevap değil, soru biriktirir.","Notu, duvara astım. Gelen herkes okuyordu. Herkes, kendi S.'sini, kendi Raif'ini hatırlıyordu. Bir adam, notun karşısında uzun uzun durdu, sonra ağlamaya başladı. 'Benim karım da böyle bir not bırakmıştı,' dedi. 'Bir kitabın içinde.'"]},{num:32,paragraphs:["Başka bir kitap, 'Aylak Adam'. İçinde, bir otobüs bileti: Adana - Ankara, 1978. Biletin arkasında: 'Bu yolculukta seni düşündüm. Cam kenarı, hep senin yerindi. — M.' Yine bir yarım kalmışlık. Yine bir dönemeyiş.","Bu notlar, bana şunu öğretti: Biz, aslında kendi hikayelerimizi yaşamıyoruz. Başkalarının hikayelerinin kenarına, küçük notlar düşüyoruz. Asıl hikaye, o notlarda saklı. Ana metin, sadece bir bahane. Tıpkı hayat gibi. Hayatın ana metni, doğum ve ölüm. Arası, hep marjinal notlar.","Ben de, kendi kitaplarımın kenarına notlar düşmeye başladım. Okuduğum her kitabın son sayfasına, o günkü havayı, çayımın tadını, dışarıdan gelen sesi yazıyordum. 'Bugün hava kapalı, çay acı, dışarıda bir çocuk ağlıyor. Bu kitabı bitirdim, ama bitmedi.'","Bir gün, bir öğrenci geldi. 'Abi, sen neden kitapların sonuna hep bir şeyler yazıyorsun?' dedi. 'Çünkü,' dedim, 'kitap bitince, ben devam edeyim diye. Yoksa boşlukta kalıyorum.'"]},{num:33,paragraphs:["Notlar çoğaldıkça, dükkanım bir arşive dönüştü. 'Yarım Kalanlar Arşivi' adını verdim. İnsanlar, yarım kalan mektuplarını, yazamadıkları şiirlerini, gönderemedikleri kartpostalları getiriyordu. Hepsini, bir kutuya koyuyordum. Kutunun üstünde yazıyordu: 'Açılmaması gereken kutu.'","Çünkü bazı hikayeler, açılmamak için yazılır. Tıpkı İhsan Kayıp'ın romanı gibi. Açarsan, biter. Bırakırsan, yaşar.","Bir kadın, bir gün, elinde bir bebekle geldi. 'Bu,' dedi, 'kocamın yazamadığı roman. O öldü, ben getirdim. İstersen yak, istersen sakla. Ama oku.' Romanı aldım. Okudum. Kötü bir romandı. Ama son cümlesi güzeldi: 'Ve kadın, bebeğiyle birlikte, dükkandan çıktı, sokağın sonundaki ışığa doğru yürüdü.'","O cümleyi, duvara astım. Gelen herkes, o ışığı görüyordu. Sokağın sonundaki ışık, hep vardı. Yeter ki yürümeyi bilelim."]},{num:34,paragraphs:["Arşiv büyüdükçe, ben küçülüyordum. Çünkü anlıyordum ki, benim hikayem, başkalarının hikayelerinin yanında, çok küçük. Ben sadece, bir sahafın oğluydum. Bir son cümle arayan bir çocuk. Ama başkaları, neler yaşamış, neler yarım bırakmış.","Bir gün, arşivin başında otururken, babamın sesi kulaklarımda çınladı: 'Toz, kitabın en büyük düşmanıdır. İnsan unutunca tozlanır.' Ben, bu arşivi kurarak, tozlanmayı engellemeye çalışıyordum. İnsanların unutulmasını engellemeye. Çünkü unutulmak, ikinci ölümdür.","O sırada, kapı açıldı. İçeri, yaşlı bir kadın girdi. Elinde, eski bir fotoğraf albümü. 'Bunlar,' dedi, 'kocamın kitapları. O, okumayı çok severdi. Şimdi alzheimer, hiçbir şey hatırlamıyor. Ben de kitaplarını sana getirdim. Belki sen hatırlarsın onun yerine.'","Albümü açtım. İçinde, kitap fotoğrafları değil, kitap okuyan bir adamın fotoğrafları vardı. Her fotoğrafta, aynı adam, farklı kitaplarla, farklı koltuklarda. Son fotoğrafta, adam, boş bir duvara bakıyor. Elinde kitap yok. Kadın, 'Bu son fotoğraf,' dedi, 'Artık okumuyor. Duvara bakıyor. Duvarı okuyor.'","Ağladık. Kadınla birlikte ağladık. Çünkü duvarı okumak, en zor okumadır."]},{num:35,paragraphs:["O kadından sonra, arşive bir bölüm daha ekledim: 'Duvarı Okuyanlar'. Okuyamayanların, ama bakmaya devam edenlerin hikayeleri. Bu bölüm, en çok ziyaret edilen bölüm oldu. İnsanlar, gelip boş duvara bakıyordu. Duvar, beyazdı. Ama herkes, orada bir şey görüyordu.","Bir çocuk, 'Ben duvarda bir gemi görüyorum,' dedi. Bir kadın, 'Ben bir mektup görüyorum,' dedi. Bir adam, 'Ben hiçbir şey görmüyorum, ama bakmak iyi geliyor,' dedi.","Bakmak iyi geliyordu. Çünkü bakmak, beklemenin bir başka adıydı. Ve beklemek, edebiyatın ta kendisiydi.","Bir akşam, dükkanı kapatırken, duvarda kendi gölgemi gördüm. Gölgem, raflardaki kitapların gölgesiyle birleşmişti. Bir an, Gölge Lügati'nin ne demek olduğunu anladım. Gölge Lügati, kelimelerin gölgelerinin toplandığı bir sözlüktü. Kelimelerin kendisi değil, gölgesi. Çünkü kelimenin kendisi, çok parlak, çok yakıcı. Gölgesi ise, serin ve dinlendirici. Tıpkı Adana sıcağında, bir çınar gölgesi gibi."]},{num:36,paragraphs:["İhsan Kayıp, belki de bu yüzden, kelimelerin gölgesini yazmak istemişti. Kelimenin kendisini değil. Çünkü kelimenin kendisi, yalan söyler. Gölgesi ise, doğruyu söyler. 'Hasret' kelimesi, sözlükte 'özlem' demektir. Ama gölgesi, ikindi vakti bir odanın aldığı ışıktır. Hangisi daha doğru? Elbette gölgesi.","Bu düşünceyle, kendi lügatimi yazmaya başladım. Küçük bir defter. Adı: 'Yusuf'un Gölge Lügati'. İlk kelime: 'Sahaf'. Tarifi: 'Babamın elleri. Mürekkepli, nasırlı, hep bir kitabı tutan eller. Sahaf, bir meslek değil, bir el biçimidir.'","İkinci kelime: 'Adana'. Tarifi: 'Çocukluğumun en sıcak günü. Kağıt kokusunun, pamuk kokusuna karıştığı an. Adana, bir şehir değil, bir kokunun adıdır.'","Üçüncü kelime: 'Son Cümle'. Tarifi: 'Hiç yazılmayan, bu yüzden de hiç unutulmayan cümle. Son cümle, yoktur. Olmadığı için vardır.'","Defter, doldukça, hafifliyordum. Çünkü kelimeleri, sözlükten çıkarıp, hayatıma koyuyordum."]},{num:37,paragraphs:["Bir gün, dükkana, daha önce hiç görmediğim bir adam geldi. Uzun boylu, zayıf, gözleri çukurda. Elinde bir bavul. 'Ben,' dedi, 'İhsan Kayıp'ın oğluyum.'","Donakaldım. İhsan Kayıp'ın hiç evlenmediğini, çocuğu olmadığını biliyordum. Adam, bavulu açtı. İçinden, daktiloyla yazılmış yüzlerce sayfa çıktı. 'Babam,' dedi, 'beni hiç kabul etmedi. Annem, onun öğrencisiymiş. Ben doğduktan sonra, o Ada'ya kaçmış. Bu sayfalar, anneme yazdığı, ama hiç göndermediği mektuplar. Annem ölmeden önce bana verdi. 'Babanı bul,' dedi.'","Mektupları okudum. Hepsi, Gölge Lügati'nin devamı gibiydi. İhsan Kayıp, oğluna, kelimelerle değil, suskunluklarla sesleniyordu. Bir mektupta şöyle yazıyordu: 'Oğlum, sana bir isim veremedim, çünkü isimler, insanı hapseder. Sen isimsiz kal, ki özgür kalasın. Ben, sana bir cümle de bırakamıyorum, çünkü cümleler de hapseder. Sen cümlesiz kal, ki hikayen bitmesin.'","Adam ağlıyordu. 'Ben,' dedi, 'babamın son cümlesini aramıyorum. Ben babamın ilk cümlesini arıyorum. Bana yazdığı ilk cümleyi.'"]},{num:38,paragraphs:["O adama, İhsan Kayıp'ın son defterini verdim. 'Al,' dedim, 'Bu senin baban. Oku. Ama bitirme. Bitirirsen, baban biter. Yarım bırak, ki baban yaşasın.'","Adam, defteri aldı, gitti. Bir daha gelmedi. Ama bir hafta sonra, dükkanın kapısının altından bir not attı: 'Okudum. Bitirmedim. Babam yaşıyor. Teşekkürler.'","Bu not, benim için, son cümleden daha değerliydi. Çünkü biri, bitirmemeyi öğrenmişti. Bu, edebiyatın en büyük dersiydi: Bitirmemeyi öğrenmek. Yarım bırakmayı, eksik kalmayı, susmayı öğrenmek.","O günden sonra, dükkanımın kapısına, küçük bir tabela daha astım: 'Burada hikayeler bitirilmez, yarım bırakılır. Yarım bırakmak isteyenler içeri girebilir.'","İnsanlar gülüyordu tabelaya. Ama içeri giriyorlardı. Çünkü herkes, bir hikayeyi yarım bırakmak istiyordu. Tamamlamak, çok yorucuydu. Yarım bırakmak ise, hafifleticiydi."]},{num:39,paragraphs:["Yıllar geçti. Dükkanım, artık bir efsaneye dönüştü. Gazeteler, hakkımda yazılar yazdı: 'Son Cümle'yi Arayan Sahaf', 'Mürekkep Bekçisi', 'Yarım Kalanların Arşivi'. Hepsi, doğruydu, hepsi de yanlıştı. Çünkü ben, hiçbir şey aramıyordum. Sadece bekliyordum. Babamın öğrettiği gibi.","Bir gün, babamdan telefon geldi. Sesi titriyordu. 'Oğlum, dükkanı satıyorum. Telefon dükkanını da. Adana'dan gidiyorum. Mersin'e, ablanın yanına. Gel, helalleşelim.'","Ertesi gün, Adana'ya gittim. Babam, evi toplamış, koliler hazır. Eski kitap kolilerinden biri, hala duruyordu. Açtım. İçinden, o ilk kitap çıktı: Değirmen. Altını çizdiğim, kenarına notlar düştüğüm Değirmen. Babam, 'Al,' dedi, 'Bu senin ilk kitabın. İlk kokun. Onu götür.'","Kitabı aldım, kokladım. Koku, aynıydı. 1974'teki o ilk günkü gibi. Hiç değişmemişti. Değişen, sadece bendim. Ve anladım ki, edebiyat, bir koku gibi, hiç değişmez. Değişen, sadece onu koklayanlardır."]},{num:40,paragraphs:["Babamla vedalaştım. O Mersin'e gitti, ben İstanbul'a döndüm. Dönerken, otobüste, Değirmen'i tekrar okudum. Bu sefer, son sayfasına bir not daha düştüm: 'Baba, ben kokuyu buldum. Koku, sensin. Sen, benim ilk cümlemsin.'","İstanbul'a döndüğümde, dükkanımın yerinde yeller esiyordu. Kapısında bir mühür: 'Kamulaştırma nedeniyle boşaltılmıştır.' Beyazıt Meydanı düzenleniyormuş, sahaflar yıkılacakmış. Sahaflar, birer birer kapanıyormuş.","Eşyalarımı topladım. Kitapları, kolilere koydum. Arşivi, notları, defterleri... Hepsini topladım. Son olarak, İhsan Kayıp'ın daktilosunu aldım. Kucağıma aldım, dışarı çıktım. Dışarıda, yağmur yağıyordu. Daktilo ıslanıyordu. Olsun, dedim. Mürekkep, suyla karışınca daha güzel olur. Tıpkı hayat gibi. Gözyaşıyla karışınca daha gerçek olur.","O gece, nereye gideceğimi bilmeden, sokaklarda dolaştım. Kucağımda daktilo, sırtımda kitap kolisi. Tıpkı bir zamanlar, babamın dükkanında, kucağımda kitapla dolaşan o çocuk gibi. Döngü, tamamlanmıştı."]},{num:41,chapter:"Bölüm V",chapterTitle:"Son Nokta Değil, Üç Nokta...",isChapterStart:!0,paragraphs:["Sahaflar Çarşısı yıkıldıktan sonra, ben de bir süre kayboldum. Tıpkı İhsan Kayıp gibi. Kimse nerede olduğumu bilmiyordu. Aslında, Adana'ya dönmüştüm. Babamın Mersin'deki evine değil, Adana'daki eski evimize. Ev, boştu, haraptı. Ama duruyordu. Duvarlarında, hala kitap izleri vardı. Rafların duvarda bıraktığı, tozdan kareler.","O evde, tek başıma, yazmaya başladım. Bu sefer, bir roman değil, bir mektup. Kime yazdığımı bilmediğim bir mektup. Belki Yaşar'a, belki İhsan Kayıp'a, belki sekiz yaşındaki kendime. Mektup, şöyle başlıyordu: 'Sevgili... Ben, mürekkebin bekçisi Yusuf. Sana, kaybolan son cümlenin hikayesini anlatacağım. Ama baştan başlayacağım. Kağıt kokusundan...'","Yazdıkça, ev doluyordu. Kelimeler, duvarlara siniyordu. Tıpkı eskiden, kitap kokusunun sindiği gibi. Bir ay boyunca, her gün yazdım. Günde bir sayfa. Tam elli sayfa. Elli sayfa, benim için bir ömür demekti. Çünkü ben, elli sayfada, bütün ömrümü anlatmıştım.","Elli sayfa bittiğinde, durdum. Son cümleyi yazmak için kalemi kaldırdım. Ama yazamadım. Çünkü son cümle yoktu. Tıpkı İhsan Kayıp'ın romanı gibi. Benim romanım da, 'çünkü...' ile bitiyordu. Çünkü..."]},{num:42,paragraphs:["Çünkü anladım ki, aradığım son cümle, hiç var olmamıştı. Varmış gibi yapmıştık. Edebiyat, varmış gibi yapma sanatıdır. Olmayan bir cümleyi, varmış gibi ararız. Bulamayınca, kendimiz yazarız. Yazdığımızda ise, anlarız ki, o cümle zaten hep oradaymış. Bizim içimizdeymiş.","Benim son cümlem, Adana'daki o ilk kağıt kokusuydu. O koku, bir cümleydi. 'Hatırla,' diyordu. 'Her şeyi hatırla. Unutma. Çünkü unutursan, tozlanırsın.'","O gün, evin kapısını kilitledim, anahtarı, Seyhan Nehri'ne attım. İstanbul'a dönmedim. Adana'da kaldım. Küçük, bir oda kiraladım. Odanın bir duvarını, kitapla kapladım. Rafları, babamın eski raflarından yaptım. Bir tabela asmadım. Çünkü tabelası olmayan dükkanlar, daha çok kitap kokar.","İnsanlar, beni buldu. Adana'da, 'Mürekkep Bekçisi geri döndü,' dediler. Geldiler. Kitap getirdiler, kitap aldılar. Ama en çok, hikaye anlattılar. Herkes, yarım kalan bir hikaye anlatıyordu. Ben de dinliyordum. Çünkü dinlemek, yazmaktan daha zor, daha değerliydi."]},{num:43,paragraphs:["Bir gün, dükkana, genç bir çocuk geldi. On yaşlarında, zayıf, gözlüklü. Elinde bir kitap: Değirmen. 'Amca,' dedi, 'Bu kitabı okudum, ama sonunu anlamadım. Bana anlatır mısın?'","Çocuğa baktım. Kendimi gördüm. Sekiz yaşındaki kendimi. Gülümsedim. 'Otur,' dedim. 'Sana bir hikaye anlatayım. Kağıt kokusuyla başlayan bir hikaye...'","Çocuğa, İhsan Kayıp'ı anlattım, Gölge Lügati'ni, yarım kalan cümleyi, Büyükada'yı, babamı, Adana'yı... Hepsini anlattım. Çocuk, dinledi. Sonra sordu: 'Peki, son cümle neymiş?'","'Son cümle yok,' dedim. 'Ama ilk koku var. Gel, kokla.' Kitabı uzattım. Çocuk, kitabı kokladı. Gözleri büyüdü. 'Mürekkep kokuyor,' dedi.","'Evet,' dedim. 'Mürekkep. Ve biraz da toz. Ve biraz da çay. Ve biraz da Adana. İşte, edebiyat bu koku. Bu kokuyu unutma. Unutursan, tozlanırsın.'"]},{num:44,paragraphs:["Çocuk gitti. Ama ertesi gün, bir başka çocuk geldi. Sonra bir başkası. Hepsi, aynı soruyu soruyordu: 'Son cümle ne?' Hepsine, aynı cevabı veriyordum: 'Koku.'","Bir gün, o çocuklardan biri, bana bir defter getirdi. 'Amca, ben yazdım,' dedi. 'Son cümleyi yazdım.' Defteri açtım. Tek bir cümle yazıyordu: 'Ve böylece, anladım ki bütün lügatler eksiktir, çünkü insan, en çok eksik olanı sever.'","Güldüm. Bu cümle, yıllar önce, Beyazıt'taki o kızın yazdığı cümleye çok benziyordu. Demek ki, cümleler de dolaşıyor, elden ele geçiyordu. Tıpkı kitaplar gibi.","Çocuğa, 'Güzel,' dedim. 'Ama bu son cümle değil, ilk cümle. Şimdi, bu cümleyle bir roman yaz. Elli sayfa. Sonra gel, bana göster.'","Çocuk, gözleri parlayarak gitti. Biliyordum ki, o da, benim gibi, bir ömür boyu o cümleyi arayacak, ve ararken, kendi cümlesini bulacaktı."]},{num:45,paragraphs:["Mevsimler geçti. Adana'da, yine portakal çiçekleri açtı. Kokusu, dükkanın içine kadar geldi. Bir sabah, dükkanı açarken, kapının önünde bir koli buldum. Üstünde isim yoktu. Açtım. İçinden, İhsan Kayıp'ın daktilosu çıktı. O Olympia. Islanmıştı, paslanmıştı, ama duruyordu. Yanında bir not: 'Bu daktilo, artık sende kalsın. Çünkü sen, bekçisin. Ben bekleyemedim, sen bekle. — Bir okur.'","Daktiloyu, dükkanın ortasına koydum. Tıpkı eskiden, Beyazıt'taki dükkanda olduğu gibi. Gelen her çocuktan, bir tuşa basmasını istiyordum. Tak... Tak... Tak... Sesler, dükkanın duvarlarında yankılanıyordu. Her tak sesi, bir harf, bir umut, bir başlangıç.","Bir gün, daktilonun şeridini değiştirdim. Yeni bir kağıt taktım. Kağıda, tek bir cümle yazdım: 'Babamın sahaf dükkanında, kağıt kokusuyla başlayan bu hikaye, aslında hiç bitmedi.'","Cümleyi yazdım, kağıdı daktilodan çıkardım, duvara astım. Gelen herkes okuyordu. Herkes, kendi kağıt kokusunu hatırlıyordu."]},{num:46,paragraphs:["Şimdi, bu satırları, Adana'da, küçük bir odada, limon kolonyası kokan bir masada yazıyorum. Dışarıda, ezan sesi, içeride, daktilonun tıkırtısı. Masamda, o ilk kitap duruyor: Değirmen. Altı çizili, kenarı notlu, kokusu hala üstünde.","Elli sayfa yazdım. Elli sayfa, bir ömür. Elli sayfa, bir koku. Elli sayfa, bir bekleyiş. Ve şimdi, son sayfadayım. Son cümleyi yazmam gerekiyor. Ama biliyorum ki, son cümle yok. Sadece, üç nokta var. Çünkü edebiyat, nokta ile değil, üç nokta ile biter. Nokta, bitirir. Üç nokta ise, devam ettirir.","Babam, bir zamanlar demişti ki, 'Toz, kitabın en büyük düşmanıdır. İnsan unutunca tozlanır.' Ben, bu elli sayfayı, tozlanmamak için yazdım. Unutmamak için. Kağıt kokusunu unutmamak için. Adana'yı unutmamak için. İhsan Kayıp'ı unutmamak için. Ve en çok da, sekiz yaşında, bir sahaf dükkanında, dizlerinin üstünde oturup bir ansiklopediyi koklayan o çocuğu unutmamak için.","O çocuk, bendim. O çocuk, sensin. O çocuk, Yaşar. O çocuk, hepimiz. Hepimiz, bir zamanlar, bir kitabın kokusuyla büyülenmiş çocuklarız. Ve hepimiz, kaybolan son cümleyi arıyoruz. Ararken, kayboluyoruz. Kaybolurken, buluyoruz."]},{num:47,paragraphs:["Bu hikayeyi, bir gece vakti, Adana'dan bir okur için yazdım. Yaşar için. O, benden elli sayfalık bir hikaye istedi. Edebi bir dille. Konusu edebiyatla ilgili olsun dedi. Ben de, edebiyatın kendisi hakkında bir hikaye yazdım. Çünkü edebiyat, kendi hakkında yazılan en güzel hikayedir. Tıpkı aynanın, kendini göstermesi gibi.","Eğer bu hikayeyi okuduktan sonra, bir sahafta durup bir kitabı koklarsan, ne mutlu bana. Eğer bir kitabın son sayfasına, kendi notunu düşersen, ne mutlu bana. Eğer yarım kalan bir cümleni, bitirmemeyi göze alırsan, ne mutlu bana. Çünkü o zaman, sen de bir bekçi olursun. Mürekkebin bekçisi.","Ve bekçilik, babadan oğula, ustadan çırağa, yazardan okura geçen en eski meslektir. Bekçi ölür, bekçilik kalır. Tıpkı yazar öldüğünde, romanın kalması gibi. Tıpkı İhsan Kayıp öldüğünde, Gölge Lügati'nin kalması gibi.","Şimdi, kalemi bırakıyorum. Daktiloyu susturuyorum. Kağıdı, rüzgara bırakıyorum. Rüzgar, onu nereye götürürse, orada okunsun. Belki Adana'da, bir sahaf dükkanında, sekiz yaşında bir çocuğun eline düşer. O da koklar. Ve hikaye, yeniden başlar."]},{num:48,paragraphs:["Çünkü bütün hikayeler, aynı yerden başlar: Bir koku, bir dokunuş, bir eksiklik. Ve bütün hikayeler, aynı yerde biter: Üç nokta ile. Çünkü üç nokta, bir son değil, bir davettir. 'Devam et,' der. 'Sen devam et.'","Ben devam ettim. Elli sayfa boyunca devam ettim. Şimdi sıra sende. Sen devam et. Kendi kağıt kokunu bul. Kendi sahafını bul. Kendi yarım kalan cümleni bul. Ve onu, bitirme. Yarım bırak. Ki yaşasın.","Adana sıcağında, tozlu raflar arasında, bir zamanlar bir çocuk vardı. O çocuk, büyüdü, yazar oldu, bekçi oldu, sonra yine çocuk oldu. Çünkü edebiyat, insanı çocuk yapar. En iyi kitaplar, bizi çocukluğumuza döndüren kitaplardır. Kağıdı kokladığımız, altını çizmeden okuduğumuz, içine düştüğümüz o ilk günlere.","İşte, o günlere dönmek için yazdım bu elli sayfayı. Dönmek için değil, dönmemek için. Çünkü dönersem, biter. Dönmezsem, devam eder. Ben devam etmeyi seçtim."]},{num:49,paragraphs:["Son bir şey daha: Bu hikayede, bir sır var. Her sayfanın ilk harfini yan yana getirirsen, bir cümle çıkar. Ama ben söylemeyeceğim. Sen bul. Bulursan, o cümle senin son cümlen olsun. Bulamazsan da, üzülme. Çünkü en güzel sırlar, hiç çözülemeyenlerdir.","Ve unutma: Bir kitap, kapağını kapattığında bitmez. Ne zaman ki kokusunu unutursun, o zaman biter. Kokusu burnundayken, hikaye devam eder. Burnunda portakal çiçeği, limon kolonyası, toz ve mürekkep kokusu varken, hikaye devam eder.","Benim burnumda, hala o koku var. 1974'ten beri, hiç gitmedi. Babamın dükkanının kokusu. Değirmen'in kokusu. Gölge Lügati'nin yanık kenarlarının kokusu. İhsan Kayıp'ın çayının kokusu. Ve şimdi, bu elli sayfanın kokusu. Hepsi birbirine karıştı. Hepsi, tek bir koku oldu: Edebiyat kokusu.","Edebiyat kokusu, dünyanın en güzel kokusudur. Çünkü o koku, hiç solmaz. Kağıt solar, mürekkep solar, insan solar, ama koku solmaz. Koku kalır. Bekçi kalır. Mürekkep bekçisi."]},{num:50,paragraphs:["Ve böylece, anladım ki bütün lügatler eksiktir, çünkü insan, eksik olanı tamamlamak için yazar. Tamamlayamadığında ise, eksikliğin kendisini sever. Eksiklik, tamamlıktan daha insani, daha sahicidir. Tıpkı yarım kalan bir cümle gibi. Tıpkı tozlu bir raf gibi. Tıpkı Adana sıcağında, bir sahaf dükkanında, sekiz yaşında bir çocuğun, bir ansiklopediyi koklayışı gibi.","O çocuk, hala orada. Dizlerinin üstünde, yerde oturmuş, kitabı kokluyor. Babası, arkasından sesleniyor: 'Yusuf, dükkanı kapatıyoruz, hadi.' Çocuk, duymuyor. Çünkü o, kitabın içinde. Kitabın kokusunun içinde. O kokunun içinde kaybolmuş. Ve kaybolduğu için, bulunmuş.","İşte, hikaye burada bitmiyor. Burada, üç nokta ile devam ediyor. Çünkü son nokta değil, üç nokta... Ve üç nokta, en dürüst noktalamadır. Bitmediğini söyler. Bitemeyeceğini söyler. Edebiyatın bitemeyeceğini. Kokunun bitemeyeceğini. Bekçiliğin bitemeyeceğini.","Babamın sahaf dükkanında, kağıt kokusuyla başlayan bu hikaye, aslında hiç bitmedi. Çünkü biterse, unutulur. Bitmezse, hatırlanır. Ben hatırlanmak için değil, hatırlamak için yazdım. Kağıt kokusunu hatırlamak için. Adana'yı hatırlamak için. Seni hatırlamak için, Yaşar."]}];function Zl(){let[e,n]=We.useState(!1),[r,t]=We.useState(!1),[a,i]=We.useState(0),[l,o]=We.useState(1),u=We.useRef(null);We.useEffect(()=>{let f=()=>{let k=window.scrollY,v=document.documentElement.scrollHeight-window.innerHeight,g=v>0?k/v*100:0;i(g);let z=document.querySelectorAll("[data-page]"),D=1;z.forEach((d)=>{if(d.getBoundingClientRect().top<200)D=parseInt(d.dataset.page||"1")}),o(D)};return window.addEventListener("scroll",f,{passive:!0}),f(),()=>window.removeEventListener("scroll",f)},[]);let c=(f)=>{let k=document.getElementById(`sayfa-${f}`);if(k)k.scrollIntoView({behavior:"smooth",block:"start"}),t(!1)},p=[{title:"Giriş: Bir İthaf",page:0,desc:"İthaf"},{title:"Bölüm I — Kağıt Kokusu",page:1,desc:"Sayfa 1-10"},{title:"Bölüm II — Yarım Kalan Roman",page:11,desc:"Sayfa 11-20"},{title:"Bölüm III — Silinen Satırlar",page:21,desc:"Sayfa 21-30"},{title:"Bölüm IV — Başkalarının Hikayeleri",page:31,desc:"Sayf
