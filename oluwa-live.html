<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oluwa — Canlı Sohbet</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#071a30;color:#eaf2ff;overflow:hidden}
  #app{display:flex;flex-direction:column;height:100dvh;max-width:720px;margin:0 auto;background:#0a1f3a;border-left:1px solid #163d63;border-right:1px solid #163d63}
  header{display:flex;align-items:center;gap:11px;padding:13px 14px;border-bottom:1px solid rgba(125,185,255,.16);background:#0b2440}
  header img{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid #22c55e}
  header b{display:block;font-size:15px;color:#fff}
  header small{display:block;font-size:10.5px;color:#7dd3a0;margin-top:2px}
  .dot{width:9px;height:9px;border-radius:50%;background:#22c55e;box-shadow:0 0 10px #22c55e;margin-left:auto}
  #araclar{display:flex;gap:6px;overflow-x:auto;padding:9px 10px;background:#0b2440;border-bottom:1px solid rgba(125,185,255,.12);scrollbar-width:none}
  #araclar::-webkit-scrollbar{display:none}
  .arac{flex:0 0 auto;border:1px solid rgba(34,197,94,.4);background:#0d2a4a;color:#9fe3b8;border-radius:18px;padding:7px 12px;font-size:11.5px;font-weight:700}
  .arac:active{background:#22c55e;color:#04240f}
  #durum{text-align:center;font-size:11.5px;color:#8fc2ff;padding:6px 10px;min-height:26px;background:rgba(13,42,74,.7);border-bottom:1px solid rgba(125,185,255,.1)}
  #mesajlar{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
  .mesaj{max-width:88%;padding:10px 13px;border-radius:15px;font-size:13.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
  .bot{background:#123a5f;color:#eaf6ff;border-bottom-left-radius:4px;align-self:flex-start;border:1px solid rgba(125,185,255,.18)}
  .kullanici{background:#22c55e;color:#05220f;border-bottom-right-radius:4px;align-self:flex-end;font-weight:600}
  .yaziyor{opacity:.6;font-style:italic}
  .mesaj img,.mesaj video{max-width:100%;border-radius:12px;margin-top:7px;display:block}
  .mesaj audio{width:100%;margin-top:7px}
  #alt{padding:9px 11px 7px;border-top:1px solid rgba(125,185,255,.16);background:#0b2440;display:flex;gap:8px;align-items:center}
  #girdi{flex:1;min-height:42px;max-height:100px;resize:none;border-radius:21px;border:1px solid rgba(125,185,255,.3);background:#0d2a4a;color:#fff;padding:10px 15px;font:inherit;font-size:13.5px;outline:none}
  #gonder{width:44px;height:44px;border-radius:50%;border:0;background:#22c55e;color:#04240f;font-size:18px;flex:0 0 44px}
  #canli{display:block;width:calc(100% - 20px);margin:2px 10px calc(10px + env(safe-area-inset-bottom));height:48px;border-radius:24px;border:1px solid rgba(34,197,94,.5);background:#0d2a4a;color:#7dd3a0;font-size:13px;font-weight:800;letter-spacing:.03em}
  #canli.aktif{background:#d90429;color:#fff;border-color:#ff6b6b;box-shadow:0 0 22px rgba(217,4,41,.6);animation:nabiz 1.1s ease-in-out infinite}
  @keyframes nabiz{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
  #dosya{display:none}
</style>
</head>
<body>
<div id="app">
  <header>
    <img src="asistan.jpg" alt="Oluwa">
    <div><b>Oluwa — Canlı Sohbet</b><small>Emel ses · görüntü/belge · TTS · görsel · video</small></div>
    <span class="dot"></span>
  </header>
  <div id="araclar">
    <button class="arac" id="btnBelge">📄 Belge/Görüntü Tara</button>
    <button class="arac" id="btnTts">🔊 TTS (Emel)</button>
    <button class="arac" id="btnGorsel">🎨 Görsel Üret</button>
    <button class="arac" id="btnVideo">🎬 Video Üret</button>
    <input type="file" id="dosya" accept="image/*,.pdf,.doc,.docx,.txt">
  </div>
  <div id="durum">Hazır. Konuşabilir, yazabilir veya bir araç seçebilirsin.</div>
  <div id="mesajlar"><div class="mesaj bot">Merhaba! Ben Oluwa, kişisel asistanın. Emel sesiyle konuşabilir, belge tarayabilir, ses/görsel/video üretebilirim.</div></div>
  <div id="alt">
    <textarea id="girdi" rows="1" placeholder="Oluwa'ya yaz..."></textarea>
    <button id="gonder" aria-label="Gönder">➤</button>
  </div>
  <button id="canli">CANLI KONUŞMA BAŞLAT</button>
</div>
<script>
(function(){
  var PANEL='https://panel.marketim3000.online';
  var API=PANEL+'/api/oluwa-chat';
  var kutu=document.getElementById('mesajlar'), girdi=document.getElementById('girdi'),
      gonderBtn=document.getElementById('gonder'), micBtn=document.getElementById('canli'),
      durum=document.getElementById('durum'), dosyaGirdi=document.getElementById('dosya');

  function ekle(metin, sinif, html){
    var d=document.createElement('div'); d.className='mesaj '+sinif;
    if(html) d.innerHTML=metin; else d.textContent=metin;
    kutu.appendChild(d); kutu.scrollTop=kutu.scrollHeight; return d;
  }
  function durumYaz(t){ durum.textContent=t; }
  function gonderLogin(d){ // sadece oturum keyi
    return d;
  }

  async function gonder(mesaj, sesli){
    if(!mesaj) return;
    girdi.value=''; ekle(mesaj,'kullanici');
    gonderBtn.disabled=true;
    var bekliyor=ekle('Oluwa yazıyor...','bot yaziyor');
    durumYaz(sesli?'Oluwa yanıtlıyor...':'Yanıt bekleniyor...');
    try{
      var res=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mesaj:mesaj})});
      var veri=await res.json();
      bekliyor.classList.remove('yaziyor');
      var cevap=veri.cevap||'Yanıt alınamadı.';
      bekliyor.textContent=cevap;
      if(sesli) emelIleKonus(cevap);
      else durumYaz('Hazır.');
    }catch(e){
      bekliyor.classList.remove('yaziyor');
      bekliyor.textContent='Bağlantı hatası: '+e.message;
      durumYaz('Bağlantı hatası');
    }finally{ gonderBtn.disabled=false; kutu.scrollTop=kutu.scrollHeight; }
  }

  var emelSes=null;
  function sesleriYukle(){
    if(!('speechSynthesis' in window)) return;
    var v=window.speechSynthesis.getVoices()||[];
    emelSes=v.find(function(x){return /emel/i.test(x.name);}) ||
            v.find(function(x){return /tr-TR/i.test(x.lang) && /kadin|woman|female|zelal/i.test(x.name);}) ||
            v.find(function(x){return /^tr/i.test(x.lang);}) || null;
  }
  if('speechSynthesis' in window){ sesleriYukle(); window.speechSynthesis.onvoiceschanged=sesleriYukle; }

  function emelIleKonus(metin){
    if(!('speechSynthesis' in window)){ durumYaz('Dinliyorum... konuşun'); if(canli) dinle(); return; }
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(metin);
    u.lang='tr-TR'; u.rate=1.03;
    if(emelSes) u.voice=emelSes;
    u.onstart=function(){ durumYaz('Emel sesiyle konuşuyorum...'); };
    u.onend=function(){ if(canli){ durumYaz('Dinliyorum... konuşun'); dinle(); } else durumYaz('Hazır.'); };
    window.speechSynthesis.speak(u);
  }

  gonderBtn.addEventListener('click',function(){ gonder(girdi.value.trim(), false); });
  girdi.addEventListener('keydown',function(e){ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); gonder(girdi.value.trim(), false); } });

  var SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
  var tanima=null, canli=false;
  if(SpeechRecognition){
    tanima=new SpeechRecognition();
    tanima.lang='tr-TR'; tanima.continuous=false; tanima.interimResults=false;
    tanima.onresult=function(e){
      var metin=e.results[0][0].transcript.trim(); if(!metin) return;
      if('speechSynthesis' in window) window.speechSynthesis.cancel();
      durumYaz('Seni duydum: '+metin); gonder(metin, true);
    };
    tanima.onerror=function(e){ durumYaz('Ses algılama: '+e.error); if(canli) setTimeout(dinle, 800); };
    tanima.onend=function(){ if(canli && !('speechSynthesis' in window && window.speechSynthesis.speaking)) setTimeout(dinle, 250); };
  }
  function dinle(){
    if(!canli || !tanima) return;
    try{ tanima.start(); durumYaz('Dinliyorum... konuşun'); }catch(e){ setTimeout(dinle, 500); }
  }
  micBtn.addEventListener('click',function(){
    if(!SpeechRecognition){ durumYaz('Bu cihaz sesli konuşmayı desteklemiyor.'); return; }
    canli=!canli;
    micBtn.classList.toggle('aktif', canli);
    micBtn.textContent=canli?'CANLI KONUŞMAYI DURDUR':'CANLI KONUŞMA BAŞLAT';
    if(canli){ if('speechSynthesis' in window) window.speechSynthesis.cancel(); dinle(); }
    else{ if('speechSynthesis' in window) window.speechSynthesis.cancel(); try{ tanima.stop(); }catch(e){} durumYaz('Hazır.'); }
  });

  document.getElementById('btnBelge').onclick=function(){ dosyaGirdi.click(); };
  dosyaGirdi.onchange=function(){
    var f=dosyaGirdi.files[0]; if(!f) return;
    durumYaz('Belge taranıyor...');
    var fd=new FormData(); fd.append('dosya',f); fd.append('soru','Belgeyi detaylı analiz et, özetle ve öne çıkan bilgileri ver.');
    fetch(PANEL+'/api/oluwa-belge',{method:'POST',body:fd})
      .then(function(r){return r.json();})
      .then(function(d){ durumYaz('Hazır.'); ekle('📄 *'+f.name+'* analizi:\n\n'+(d.cevap||d.hata||'Sonuç yok.'),'bot'); })
      .catch(function(e){ durumYaz('Hata: '+e.message); });
    dosyaGirdi.value='';
  };

  document.getElementById('btnTts').onclick=function(){
    var metin=girdi.value.trim()||'Merhaba, ben Oluwa, kişisel asistanınızım.';
    durumYaz('Emel sesiyle MP3 üretiliyor...');
    fetch(PANEL+'/api/oluwa-tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({metin:metin})})
      .then(function(r){return r.json();})
      .then(function(d){
        durumYaz('Hazır.');
        if(d.basarili && d.url){
          ekle('🔊 *Emel sesiyle seslendirildi:*\n\n'+metin,'bot',null);
          var p=ekle('','bot',true);
          p.innerHTML='<audio controls autoplay src="'+PANEL+d.url+'"></audio>';
        } else ekle('TTS hatası: '+(d.hata||'bilinmiyor'),'bot');
      })
      .catch(function(e){ durumYaz('Hata: '+e.message); });
  };

  document.getElementById('btnGorsel').onclick=function(){
    var prompt=girdi.value.trim()||'Modern dijital kitap kapak tasarımı';
    durumYaz('Görsel üretiliyor... (bu biraz sürebilir)');
    fetch(PANEL+'/api/oluwa-gorsel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:prompt})})
      .then(function(r){return r.json();})
      .then(function(d){
        durumYaz('Hazır.');
        if(d.basarili && d.url){
          var p=ekle('🎨 '+prompt,'bot');
          var img=document.createElement('img'); img.src=PANEL+d.url; img.alt=prompt; p.appendChild(img);
        } else ekle('Görsel hatası: '+(d.hata||'bilinmiyor'),'bot');
      })
      .catch(function(e){ durumYaz('Hata: '+e.message); });
  };

  document.getElementById('btnVideo').onclick=function(){
    var prompt=girdi.value.trim()||'Dijital kitap tanıtım videosu';
    durumYaz('Video üretiliyor... (1-2 dakika sürebilir)');
    fetch(PANEL+'/api/oluwa-video',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:prompt})})
      .then(function(r){return r.json();})
      .then(function(d){
        durumYaz('Hazır.');
        if(d.basarili && d.url){
          var p=ekle('🎬 '+(d.baslik||prompt),'bot');
          var v=document.createElement('video'); v.src=PANEL+d.url; v.controls=true; v.playsInline=true; p.appendChild(v);
        } else ekle('Video hatası: '+(d.hata||'bilinmiyor'),'bot');
      })
      .catch(function(e){ durumYaz('Hata: '+e.message); });
  };

  girdi.focus();
})();
</script>
</body>
</html>
