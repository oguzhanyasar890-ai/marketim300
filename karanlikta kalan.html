<p>Bu roman, sıradan görünen insanların hayatlarındaki karanlık sırları, bastırılmış anıları ve aile içi çatışmaları konu alır. Her bölüm, bir sonrakinin kapısını aralar. Ve son sayfaya kadar gerçek, katman katman soyulur.</p>
<h2 class='chapter'>Bölüm 1: Dönüş</h2>
<p>Otobüs, Karadeniz’in o kıvrımlı dağ yollarından birini tırmanırken Selin, camdan dışarıyı izliyordu. On beş yıl. Tam on beş yıl geçmişti bu yollardan geçmeyeli. Aynı ıslak asfalt kokusu, aynı sisli vadiler, aynı yalnızlık hissi.</p>
<p>Telefondaki ses hâlâ kulaklarında çınlıyordu:</p>
<p>“Kardeşiniz... Seda Hanım... Dün gece evinde ölü bulundu. Başsağlığı dilerim.”</p>
<p>Selin, o an ne hissettiğini hâlâ çözemiyordu. Üzüntü mü? Şok mu? Yoksa yıllardır içinde biriken o tarifsiz öfke mi? Seda, küçük kardeşi. Onu en son gördüğünde Seda on yedi yaşındaydı; şimdi otuz iki. Bir ömür geçmiş arada. Bir ömür ki, telefon hatları bile iki kız kardeşi bir araya getirmeye yetmemişti.</p>
<p>Otobüs sonunda küçük terminale yanaştı. Selin valizini aldı, soğuk havayı ciğerlerine çekti. Tirebolu. Bu kasaba onu her zaman boğmuştu. Ama şimdi geri gelmek zorundaydı. Cenaze vardı. Ve daha da önemlisi, cevaplanması gereken sorular vardı.</p>
<p>Onu terminalde karşılayan kişi, çocukluk arkadaşı—eski dostu—değil, bir yabancıydı. Uzun boylu, gözlüklü, solgun yüzlü bir adam. Elini uzattı:</p>
<p>“Merhaba. Ben Doktor Kerem. Seda’nın... komşusuyum. Aynı zamanda sizi arayan bendim.”</p>
<p>Selin elini sıktı. Soğuktu. “Neden siz aradınız? Polis değil, aile değil... Bir komşu?”</p>
<p>Kerem gözlerini kaçırdı. “Çünkü Seda’nın size ulaşılmasını isteyen tek kişi bendim. Ve onun ölümü hakkında konuşmamız gerekiyor. Burada değil.”</p>
<p>Selin’in içinde bir şey kıpırdadı. Yıllardır bastırdığı o his: karanlık bir şeyin yaklaştığı hissi. “Ne demek istiyorsunuz?”</p>
<p>Kerem etrafına bakındı, sesini alçalttı: “Seda intihar etmedi, Selin Hanım. Ve bunu size söyleyecek kimse yoktu. Ben de... Seda’yı tanıyordum. Sizi bulmamı o istedi. Bir mektup bıraktı. Ama size değil. Bana.”</p>
<p>Selin’in midesi kasıldı. Valizi elinden kayar gibi oldu. “Ne mektubu?”</p>
<p>Kerem yürümeye başladı, Selin’i terminalin arkasındaki sessiz bir çay bahçesine yönlendirdi. Yağmur başlıyordu—ince, ısrarcı bir Karadeniz yağmuru. Masaya oturdular. Kerem cebinden katlanmış, ıslanmış bir kağıt çıkardı.</p>
<p>“Bunu ben buldum. Seda’nın masasında, bir kitabın arasında. Üç gün önce. Ölümünden bir gün önce.”</p>
<p>Selin kağıdı açtı. El yazısı Seda’nındı. Sallantılı, aceleyle yazılmış:</p>
<p>“Kerem, eğer bunu okuyorsan, bir şeyler ters gitti demektir. Ablama söyle: Mektuplar yalan söylemez. Ve o sandığından çok daha fazlasını biliyor. Karanlıkta kalan sadece ben değilim. O da karanlıkta. Ona sor: 1998 yazında bizim evde ne oldu? O zaman hatırlayacak. Korkmasın. Çünkü asıl korkulması gereken şey, hatırladıkları değil. Hatırlamadıkları.”</p>
<p>Selin kağıdı bıraktı. Elleri titriyordu. “1998... Ben o yaz on altı yaşındaydım. Seda iki yaşındaydı. Ne demek istiyor?”</p>
<p>Kerem gözlerini dikti: “Bilmiyorum. Ama Seda son altı aydır çok tuhaftı. Uyumuyordu. Sürekli ‘bir şeyler hatırlıyorum’ diyordu. Sonra... ‘ablam da hatırlamalı’ diyordu. Selin Hanım, kardeşiniz ölmeden önce delirmiyordu. Aksine, ilk kez gerçeğe uyanıyordu.”</p>
<p>Selin başını salladı, yağmurun sesiyle birlikte içindeki çığlığı bastırdı. On beş yıldır kaçtığı şey, şimdi karşısındaydı. Karanlıkta kalan anılar. Ve o anılardan biri, kendi elleriyle kilitlediği bir kapının arkasındaydı.</p>
<p>“Beni eve götür,” dedi sonunda. “Seda’nın evine. Kalmak istiyorum. Ve o mektupları bulmak istiyorum.”</p>
<p>Kerem başını salladı. “Mektuplar dediniz. Seda da ‘mektuplar’ diyordu. Ama ben sadece bir tane buldum. Diğerleri... Bir yerde saklı olmalı. Ve sizi bekliyorlar.”</p>
<p>Yağmur hızlandı. Selin, çocukluğunun kasabasına baktı. Her şey aynıydı: dar sokaklar, çay bahçeleri, sisli tepeler. Ama o sisin içinde bir şey vardı. On beş yıl önce olduğu gibi. Karanlık. Ve bu sefer, Selin ondan kaçmayacaktı. Çünkü kaçacak yeri kalmamıştı.</p>
<h2 class='chapter'>Bölüm 2: Ev</h2>
<p>Seda’nın evi, kasabanın dışındaki eski bir taş binaydı. Selin kapıyı açtığında, içeri dolan rutubet ve lavanta kokusu onu çocukluğuna fırlattı. Anneannesi bu kokardı. Lavanta. Ve sigara. Ve korku.</p>
<p>Ev dağınık değildi. Aksine, takıntılı bir düzen vardı. Kitaplar alfabetik, mutfak eşyaları boy sırasına göre. Ama duvarlarda bir şey dikkatini çekti: Seda her yere notlar yapıştırmıştı.</p>
<p>“Onu hatırlıyor musun?” “Kuyu. Neden kuyu?” “Anne bizi neden o odaya kilitledi?” “Selin neden hiç geri dönmedi?”</p>
<p>Selin notları tek tek okudu. Elleri titriyordu. “Kuyu” kelimesi defalarca tekrarlanmıştı. Ve “o oda.” 1998 yazı. O yaz, Selin’in hatırladığı tek şey, annesinin onu bir sabah apar topar teyzesine göndermesiydi. “Bir süre burada kal,” demişti. Ama o “süre” on beş yıl sürmüştü.</p>
<p>Doktor Kerem kapıda duruyordu. “Seda son haftalarda bu notları yazıyordu. Ve her gece... kuyuya bakıyordu. Arka bahçedeki eski kuyuya.”</p>
<p>Selin arka bahçeye çıktı. Yağmur dinmiş, toprak nemliydi. Kuyu oradaydı: taş duvarlı, kapaksız, derin. Selin eğildi. İçerisi karanlıktı. Ama bir şey vardı. Kuyunun duvarına kazınmış yazı:</p>
<p>“SELİN BUNU OKUYORSA, BEN HÂLÂ ORADAYIM.”</p>
<p>Selin geri çekildi. Nefesi kesilmişti. “Bu ne demek?”</p>
<p>Kerem yanına geldi. “Seda kazımış olabilir. Ama tarih atılmış. Bak.”</p>
<p>Yazının altında küçük bir tarih vardı: 12.08.1998.</p>
<p>Selin’in dünyası başına yıkıldı. “Bu... o tarihte ben buradaydım. Seda iki yaşındaydı. Nasıl bunu kazımış olabilir?”</p>
<p>Kerem cevap vermedi. Sadece kuyuya baktı. Ve sessizlikte, Selin bir şey duydu. Kuyudan gelen bir ses. Bir çocuk sesi. Fısıltıyla:</p>
<p>“Abla... beni neden bıraktın?”</p>
<p>Selin geri çekildi, tökezledi. Kerem onu tuttu. “Selin Hanım, iyi misiniz?”</p>
<p>Selin başını salladı, ama içindeki ses susmuyordu. O ses, yıllardır susturduğu ses, şimdi geri dönmüştü. Ve bu sefer, ona bir isim veriyordu: Seda.</p>
<p>“Kerem,” dedi titreyen sesle. “Seda’nın ölüm raporunu gördünüz mü? Nasıl öldü?”</p>
<p>Kerem başını salladı. “Boğulma. Ama evde su yoktu. Küvet boştu. Ve Seda’nın ciğerlerinde... kuyu suyu bulundu.”</p>
<p>Selin gözlerini kapadı. Karanlıkta kalan, sadece anılar değildi. Bir ceset vardı. Ve o ceset, kendi kardeşiydi. Ama daha da kötüsü: Selin, o gece orada olduğunu hatırlamıyordu. Hiç hatırlamamıştı.</p>
<h2 class='chapter'>Bölüm 3: Mektuplar</h2>
<p>Gece yarısı. Selin, Seda’nın odasında, yatağına oturmuş, mektupları arıyordu. Notlar, defterler, kitaplar... Hiçbiri. Ta ki yatağın altındaki eski bir bavulu açana kadar.</p>
<p>Bavulun içinde, çocukluk fotoğrafları vardı. Ama bir tanesi diğerlerinden farklıydı: 1998 yazında çekilmiş bir aile fotoğrafı. Anne, baba, Selin, Seda. Ve arka planda, kuyunun yanında duran bir kadın. Yüzü karalanmıştı.</p>
<p>Selin fotoğrafı çevirdi. Arkasında Seda’nın el yazısıyla:</p>
<p>“Bu kadın kim? Anne neden ondan nefret ediyordu? Ve neden... beni o kuyuya attı?”</p>
<p>Selin’in elleri titredi. Fotoğrafı bıraktı. Bavulun dibinde, bir zarf vardı. Üzerinde: “Ablama. Ben öldükten sonra.”</p>
<p>Zarfı açtı. İçinde bir mektup ve bir anahtar vardı. Mektup, Seda’nın el yazısıyla:</p>
<p>“Sevgili Selin,</p>
<p>Eğer bunu okuyorsan, ben ölmüşüm demektir. Ve sen sonunda eve dönmüşsün. Bunu yazarken, hâlâ o kuyunun sesini duyuyorum. Ama artık biliyorum: O ses benim değil. Senin. Sen o kuyuya düştüğünde, ben iki yaşındaydım. Ama hatırlıyorum. Çünkü anne bana hep ‘ablana bir şey olursa, sen sorumlusun’ derdi. Ve ben seni kurtaramadım.</p>
<p>Selin, sen o kuyuda üç gün kaldın. Üç gün. Ve kimse seni aramadı. Anne, ‘kayboldu’ dedi. Baba, ‘polise gitmeyin’ dedi. Ve sen çıktığında, hiçbir şey hatırlamıyordun. Doktorlar ‘travma’ dedi. Ama travma değildi. Anne seni o kuyuya kendi attı. Ve seni oradan çıkaran kişi... o karalanmış kadındı.</p>
<p>O kadın kim mi? Ben de bilmiyorum. Ama anahtar sende. O anahtar, annemin yıllardır sakladığı bir sandığa ait. Sandık, teyzemin evinde. Ve içinde... her şeyin cevabı var.</p>
<p>Beni affet. Ve kendini affet. Çünkü sen kurban değilsin. Sen sadece... hatırlamak istemedin.</p>
<p>Sonsuza kadar, Seda.”</p>
<p>Selin mektubu göğsüne bastırdı. Gözyaşları, yıllardır ilk kez, serbest kaldı. Ama içindeki ses susmuyordu. O ses, şimdi bir soru soruyordu: Peki neden Seda öldü? Ve neden kuyu suyuyla?</p>
<p>Cevap, o sandıkta olmalıydı. Ve Selin, o sandığı açmaya hazırdı. Ama önce, o karalanmış kadını bulmalıydı. Çünkü o kadın, onu kuyudan çıkaran kişiydi. Ve belki de... onu tekrar karanlığa çeken kişi.</p>
<h2 class='chapter'>Bölüm 4: Teyze</h2>
<p>Sabah olduğunda Selin, bavulu tekrar kapamış, mektubu cebine koymuştu. Anahtar avucunun içinde soğuk bir metal gibi duruyordu. Kerem kapıda belirdiğinde, Selin onu içeri davet etmeden konuştu:</p>
<p>“Teyzeme gidiyorum. Bugün.”</p>
<p>Kerem kaşlarını çattı. “Nursel Hanım mı? Seda ondan pek bahsetmezdi. Hatta... ondan korktuğunu söylerdi.”</p>
<p>“Ben de korkuyordum. On beş yıl önce. Ama artık korkmuyorum.” Selin ceketini giydi. “Sen geliyor musun?”</p>
<p>Kerem tereddüt etti. “Selin Hanım, dün geceyi düşündüm. Seda’nın ölümü... basit bir cinayet değil. Eğer aileniz gerçekten... tehlikeliyse—”</p>
<p>“Biliyorum.” Selin kapıyı açtı. “Ama Seda mektubunda ‘anahtar sende’ diyor. Bu anahtar bir sandığa ait ve o sandık teyzemin evinde. Eğer cevapları istiyorsam, o eve girmeliyim.”</p>
<p>Kerem bir an durdu, sonra başını salladı. “Tamam. Ama ben de geleceğim. Seda’nın ölümünü araştırıyorum. Ve sen onun kardeşisin. İkimiz de aynı gerçeğe bakıyoruz.”</p>
<p>Yola çıktıklarında hava hâlâ kapalıydı. Kasabanın içinden geçerken Selin, tanıdık yüzler gördü ama kimse onu tanımadı. Ya da tanımak istemedi. On beş yıl, küçük bir kasabada bir kişiyi silmek için yeterliydi.</p>
<p>Teyzesinin evi, kasabanın en yüksek tepesindeydi. Eski, ahşap, iki katlı bir konak. Selin çocukluğunda bu eve “kule” derdi. Çünkü tepeden tüm kasabayı görürdü. Ve şimdi, o kuleye tırmanırken, içinde bir his vardı: Bu ev, sadece kasabayı değil, tüm sırları da görüyordu.</p>
<p>Kapıyı çaldı. Uzun bir sessizlik oldu. Sonra kapı gıcırdayarak açıldı. Nursel teyze, on beş yıl önceki gibiydi: İnce, uzun, sert yüzlü. Ama gözlerinde bir şey değişmişti. Korku. Selin bunu hemen fark etti.</p>
<p>“Selin.” Teyzesinin sesi çatallıydı. “Gel içeri. Ama çabuk. Kimse görmesin.”</p>
<p>İçeri girdiler. Ev, lavanta ve naftalin kokuyordu. Selin, çocukluğunda bu kokuyu severdi. Şimdi ise midesini bulandırıyordu.</p>
<p>Nursel teyze, oturma odasına geçti, perdeleri çekti. Sonra Selin’e döndü:</p>
<p>“Neden geldin? Seda’nın ölümü... Senin burada olman... Tehlikeli, Selin. Çok tehlikeli.”</p>
<p>“Biliyorum.” Selin cebinden anahtarı çıkardı. “Ama Seda bana bir mektup bıraktı. Ve bu anahtar... Senin evinde bir sandığa ait. O sandığı açmam lazım.”</p>
<p>Nursel teyzenin yüzü bembeyaz oldu. “O anahtar... Nereden buldun?”</p>
<p>“Seda’nın bavulundan. Teyze, ne saklıyorsun? Ne var o sandıkta?”</p>
<p>Nursel uzun bir süre sessiz kaldı. Sonra pencereden dışarı baktı, sanki birinin gelip gelmediğini kontrol ediyordu. “Selin,” dedi sonunda, “annen hasta değildi. Deli de değildi. O korkuyordu. Hepimiz korkuyorduk.”</p>
<p>“Kimden?”</p>
<p>“Baban... ve onun ‘iş’ arkadaşlarından.” Nursel titreyen elleriyle sigara yaktı. “Baban, göründüğü gibi biri değildi. O özel biriydi. İnsanların sorunlarını çözerdi. Ama yasal yollarla değil.”</p>
<p>Selin’in midesi kasıldı. “Yani... tetikçi mi?”</p>
<p>Nursel cevap vermedi. Sadece sigarasından derin bir nefes çekti. “O sandık... Annemin. Yani anneannenin. Ve içinde... bir günlük var. O günlük, ailemizin en büyük utancını saklıyor. Ve o utancın içinde... bir cinayet var.”</p>
<p>Selin yaklaştı. “Kimin cinayeti?”</p>
<p>Nursel gözlerini kapadı. “Meryem’in. Annemin kız kardeşi. Benim teyzem. Yıllarca intihar etti sanıldı. Ama intihar değildi.”</p>
<p>“Kim öldürdü?”</p>
<p>Nursel gözlerini açtı. Ve Selin, o gözlerde bir şey gördü: Nefret. “Baban,” dedi fısıltıyla. “Baban öldürdü. Ve annen yardım etti.”</p>
<p>Selin geri çekildi. Bir sandalyeye tutundu. “Bu imkânsız. Babam... O hep sessiz, sakin bir adamdı. Hiç—”</p>
<p>“Hiç kimseye zarar vermedi, değil mi?” Nursel acı bir kahkaha attı. “Selin, sen o yazı hatırlamıyorsun. Ama ben hatırlıyorum. 1998 yazında, sen kuyuya düştüğünde, baban seni kurtarmadı. Seni orada bıraktı. Çünkü sen bir şey görmüştün. Meryem’in cesedini gömmesini görmüştün.”</p>
<p>Selin’in dünyası başına yıkıldı. “Yani... ben o gece... ”</p>
<p>“Evet. Sen, sekiz yaşında, bir cinayete tanık oldun. Ve baban, seni susturmak için kuyuya attı. Ama ölmedin. Çıktın. Ve annen seni o kuyudan çıkardığında, sana bir şey yaptı.”</p>
<p>“Neye?”</p>
<p>Nursel sigarasını söndürdü. “Seni hipnotize etti. Anılarını sildi. Bir doktor buldu, kaçak, ruhsuz bir adam. Ve sen her şeyi unuttun.”</p>
<p>Selin başını salladı. Gözyaşları yoktu. Sadece boşluk vardı. “Peki Seda? O neden öldü?”</p>
<p>Nursel gözlerini kaçırdı. “Çünkü Seda hatırlamaya başladı. Ve baban bunu öğrendi.”</p>
<h2 class='chapter'>Bölüm 5: Sandik</h2>
<p>Nursel teyze, Selin’i üst kata çıkardı. Koridorun sonundaki küçük bir odaya girdiler. Oda, tozlu ve karanlıktı. Ortada, eski bir sandık vardı. Kilitli.</p>
<p>“Anahtar sende,” dedi Nursel. “Ama açmadan önce... Bir şey daha söylemeliyim.”</p>
<p>Selin anahtarı kilide soktu. “Ne?”</p>
<p>“Seda ölmeden üç gün önce buraya geldi. Beni ziyaret etti. Ve o sandığı açmamı istedi. Ben açmadım. Korktum. O zaman, Seda bana dedi ki: ‘Teyze, eğer ben ölürsem, ablama söyle. O sandığı açsın. Ve içindekini polise götürsün.’”</p>
<p>Selin elini durdurdu. “Neden polise? Neden kendisi götürmedi?”</p>
<p>Nursel başını öne eğdi. “Çünkü Seda ölmeden önce bana bir şey daha söyledi. ‘Teyze,’ dedi, ‘ben korkuyorum. Ama ablamdan değil. Ablam... o masum. O sadece... hatırlamıyor. Ama ben hatırlıyorum. Ve hatırladığım şey... beni öldürecek.’”</p>
<p>Selin anahtarı çevirdi. Kilit açıldı. Sandığın kapağını kaldırdığında, içinde üç şey vardı: Bir günlük, birkaç mektup ve bir fotoğraf. Fotoğrafta, genç bir kadın vardı. Meryem. Ve yanında... Selin’in annesi. İkisi de gülümsüyordu. Ama Meryem’in gözlerinde bir şey vardı. Korku.</p>
<p>Selin günlüğü aldı. Kapağında, “Meryem’in Günlüğü” yazıyordu. İlk sayfayı açtı:</p>
<p>“12 Ağustos 1997. Bugün, en büyük hatamı işledim. Ablamın kocası... Bana dokundu. Ve ben karşı koyamadım. Çünkü o, her şeyi biliyordu. Ablamın geçmişini. Ve eğer konuşursam, ablama zarar vereceğini söyledi. Ne yapacağımı bilmiyorum. Ama bir şey biliyorum: Bu adam, bir canavar. Ve bir gün... bir gün onu durduracağım.”</p>
<p>Selin’in elleri titredi. Sayfaları çevirdi. Bir sonraki giriş, bir ay sonraydı:</p>
<p>“10 Eylül 1997. Hamileyim. O adamın çocuğunu taşıyorum. Ablama söyleyemem. Kimseye söyleyemem. Ama bu çocuğu doğurmayacağım. Bu, onun kanını taşıyamaz.”</p>
<p>Selin başını kaldırdı. “Teyze... Meryem... hamile miydi?”</p>
<p>Nursel başını salladı. “Evet. Ve o çocuğu aldırmaya çalıştı. Ama baban öğrendi. Ve onu öldürdü. Çünkü o çocuk, babanın çocuğuydu.”</p>
<p>Selin’in midesi bulandı. “Yani... benim bir kuzenim olabilirdi?”</p>
<p>“Hayır. Çünkü baban, Meryem’i öldürdükten sonra, cesedi... parçaladı. Ve parçaları... kuyuya attı. Senin düştüğün kuyuya.”</p>
<p>Selin geri çekildi. Sandığa tekrar baktı. Mektupları aldı. Üzerlerinde, “Selin’e” yazıyordu. Ama gönderen... Seda’ydı. Mektuplar, Seda’nın ölümünden önce yazdığı mektuplardı. Ve hepsi aynı şeyi söylüyordu:</p>
<p>“Ablam, beni affet. Ben seni kurtaramadım. Ama şimdi gerçeği bulmalısın. Çünkü ben ölüyorum. Ve ölmeden önce, sana bir şey söylemeliyim: Babamız ölmedi. O o hâlâ burada. Ve seni izliyor.”</p>
<p>Selin mektubu bıraktı. “Bu ne demek? Babam ölmedi mi? Cenazesine gitmedim ama annem öldü dedi.”</p>
<p>Nursel başını salladı. “Baban ölmedi, Selin. Ölmedi. Sadece... saklandı. Ve şimdi Seda öldü. Ve sen buraya geldin. Bu, onun planıydı.”</p>
<p>Selin, Kerem’e döndü. Kerem’in yüzü de bembeyazdı. “Kerem... sen biliyor muydun?”</p>
<p>Kerem başını salladı. “Hayır. Ama Seda bana bir şey söylemişti. ‘Babam yaşıyor’ demişti. Ben inanmamıştım. Deli olduğunu düşündüm.”</p>
<p>Selin elindeki mektupları sıktı. “O zaman... o zaman babamı bulmalıyız. Ve onu durdurmalıyız.”</p>
<p>Nursel titreyen elleriyle Selin’in kolunu tuttu. “Selin... bebeğim... Babanı bulmak, ölümüne davetiye çıkarmaktır. O adam... o adam bir canavar. Ve sen onun kızısın. Ama aynı zamanda... onun en büyük tanığısın.”</p>
<p>Selin, teyzesine baktı. Gözlerinde, yıllardır ilk kez, bir kararlılık vardı. “Biliyorum. Ama artık kaçmayacağım. Seda öldü. Ve ben onun intikamını alacağım.”</p>
<h2 class='chapter'>Bölüm 6: Gömülü Gerçek</h2>
<p>Selin ve Kerem, teyzenin evinden çıktıklarında hava kararmıştı. Selin’in aklında tek bir şey vardı: Babasını bulmak. Ama nereden başlayacaktı?</p>
<p>Kerem, arabayı çalıştırdı. “Selin... dün gece bir şey buldum. Seda’nın bilgisayarında. Silinmiş bir dosya. Ama kurtarmayı başardım.”</p>
<p>Selin ona döndü. “Ne dosyası?”</p>
<p>“Bir harita. Kasabanın dışında, ormanda bir yer işaretlenmiş. Ve yanında bir not: ‘O burada. Onu buldum.’”</p>
<p>Selin’in kalbi hızlandı. “O yer... neresi?”</p>
<p>“Eski bir kulübe. Kasabanın kuzeyinde. Terk edilmiş. Ama Seda’nın notuna göre... orada biri yaşıyor.”</p>
<p>Selin başını salladı. “Oraya gidiyoruz.”</p>
<p>Araba, orman yoluna girdiğinde, Selin’in içinde bir his vardı. Bu yol, tanıdıktı. Çocukluğunda, babası onu bu yola getirirdi. “Avlanmaya” derdi. Ama hiç avlanmazlardı. Sadece yürürlerdi. Ve babası hep bir şeyler fısıldardı. Dua gibi. Ama dua değildi.</p>
<p>Kulübe, ağaçların arasında belirdiğinde, Selin’in nefesi kesildi. Kulübenin önünde bir kuyu vardı. Küçük, taş örülü. Ve kuyunun yanında... bir mezar. Basit bir taşla işaretlenmiş.</p>
<p>Kerem arabayı durdurdu. “Selin... bu... ”</p>
<p>Selin arabadan indi. Mezara doğru yürüdü. Taşta, tek bir isim yazıyordu: MERYEM. 1970- 1998.</p>
<p>Selin dizlerinin üzerine çöktü. “Onu... buraya gömmüşler. Baban onu buraya gömmüş.”</p>
<p>Kerem yanına geldi. “Selin, buradan gitmeliyiz. Eğer baban... eğer biri gelirse—”</p>
<p>“Bekle.” Selin mezarın yanındaki toprağı işaret etti. “Bak. Toprak... yeni kazılmış.”</p>
<p>Kerem eğildi. “Bu mezar açılmış. Ve tekrar kapatılmış.”</p>
<p>Selin eliyle toprağı kazmaya başladı. Kerem onu durdurmaya çalıştı ama Selin dinlemedi. Birkaç dakika sonra, parmakları bir şeye değdi. Bir kumaş parçası. Ve bir kemik.</p>
<p>Selin geri çekildi. “Bu Meryem değil. Bu... başka biri.”</p>
<p>Kerem elini tuttu. “Selin, dur. Bu bir suç mahalli. Polisi aramalıyız.”</p>
<p>“Hayır.” Selin ayağa kalktı. “Önce ne olduğunu anlamalıyım.”</p>
<p>Tam o sırada, kulübenin kapısı gıcırdayarak açıldı. İçeriden bir ses geldi:</p>
<p>“Hoş geldin, kızım. Seni bekliyordum.”</p>
<p>Selin döndü. Kapıda, yaşlı, yorgun bir adam duruyordu. Ama gözleri tanıdıktı. Selin’in gözleri. Babası.</p>
<p>“Sen ” Selin’in sesi titredi. “Sen ölmedin.”</p>
<p>Adam gülümsedi. “Ölmedim. Ama sen beni öldürmeye geldin, değil mi? Tıpkı annen gibi. Tıpkı Seda gibi.”</p>
<p>Selin geri çekildi. “Seda’yı... sen mi öldürdün?”</p>
<p>Adam başını salladı. “Hayır. Seda kendini öldürdü. Ama ben onu izledim. Çünkü o o gerçeği biliyordu. Ve sen de artık biliyorsun.”</p>
<p>Selin, Kerem’e baktı. Kerem, ceketinin içinden bir şey çıkardı. Bir silah. “Baba... yeter.”</p>
<p>Adam güldü. “Kerem... sen hâlâ buradasın. Seda’nın intikamını almaya mı geldin? Ama unuttun mu? Seda’yı... sen öldürdün.”</p>
<p>Kerem’in eli titredi. “Hayır. Ben onu kurtarmaya çalıştım.”</p>
<p>“Kurtarmaya mı?” Adam başını salladı. “Sen, Seda’yı kuyuya attın. Onu boğdun. Ve şimdi kızımı da öldürmek istiyorsun.”</p>
<p>Selin, Kerem’e baktı. “Kerem... bu doğru mu?”</p>
<p>Kerem gözlerini kaçırdı. “Selin... ben Seda’yı seviyordum. Ama o o delirmişti. Sürekli ‘babam yaşıyor’ diyordu. Ben onu sakinleştirmek için... kuyuya götürdüm. Sadece korkutmak için. Ama o düştü. Ve ben onu kurtaramadım.”</p>
<p>Selin’in dünyası tekrar yıkıldı. “Yani sen Seda’nın ölümünden sorumlusun?”</p>
<p>Kerem başını salladı. Gözyaşları yüzünden akıyordu. “Evet. Ve şimdi seni kurtarmak için buradayım.”</p>
<p>Selin, babasına döndü. “Peki sen? Sen neden buradasın? Neden saklanıyorsun?”</p>
<p>Adam gülümsedi. “Çünkü ben bir hayaletim. Ve hayaletler asla ölmez.”</p>
<p>Tam o sırada, uzaktan polis sireni duyuldu. Selin, teyzesine mesaj atmıştı. “Kerem,” dedi Selin. “Silahı bırak. Polis geliyor.”</p>
<p>Kerem silahı bıraktı. Ama babası gülümsedi. “Polis mi? Kızım... polis benim en iyi dostum. Çünkü ben onların en eski muhbiriyim.”</p>
<p>Selin’in gözleri büyüdü. “Ne?”</p>
<p>“Yıllarca, bu kasabada işlenen cinayetleri çözdüm. Polis beni korur. Çünkü ben onların en değerli aracıyım. Ve sen benim kızımsın. Ama artık bir sorunsun.”</p>
<p>Adam ceketinden bir bıçak çıkardı. “Ve ben sorunları çözerim.”</p>
<p>Selin geri çekildi. Ama Kerem öne atıldı. “Selin! Kaç!”</p>
<p>Selin koşmaya başladı. Ormanın içine doğru. Ama babasının sesi hâlâ kulaklarında çınlıyordu:</p>
<p>“Kaç kızım! Kaç! Ama unutma: Karanlıkta kalan... her zaman sen olacaksın!”</p>
<h2 class='chapter'>Bölüm 7: Ormanda</h2>
<p>Selin, dalların arasından geçerken yüzünü çizen dikenlere aldırmadı. Nefesi kesiliyordu, kalbi göğsünü delercesine çarpıyordu ama durmadı. Babasının sesi hâlâ kulaklarında yankılanıyordu:</p>
<p>“Kaç kızım! Kaç! Ama unutma: Karanlıkta kalan... her zaman sen olacaksın!”</p>
<p>Ayağı bir köke takıldı, yere yuvarlandı. Islak toprak, yüzüne sıçradı. Bir an nefes almak için durduğunda, zihninde bir şimşek çaktı. Bu orman. Bu ağaçlar. Bu koku. Daha önce buradaydı. Çok önce. Sekiz yaşındayken.</p>
<p>“Selin, hadi! Saklanma sırası sende!”</p>
<p>Bir çocuk sesi. Kendi sesi. Ama yanında başka bir ses daha vardı. Bir kız çocuğu. Meryem’in kızı mı? Yoksa... kendisi mi? Anılar birbirine karışıyordu.</p>
<p>Selin doğruldu. Gözlerini kapadı. Nefesini tuttu. Ve anıların gelmesine izin verdi.</p>
<p>1998 yazı. Sıcak bir gün. Babası onu ormana getirmişti. “Avlanmaya” demişti. Ama av yoktu. Sadece bir kuyu vardı. Ve kuyunun yanında bir kadın. Meryem. Babası Meryem’le tartışıyordu.</p>
<p>“Bunu yapamazsın,” diyordu Meryem. “Çocuk büyüyor. Ve bir gün her şeyi öğrenecek.”</p>
<p>Babası güldü. “Hangi çocuk? Senin karnındaki mi? O çocuk asla doğmayacak.”</p>
<p>Meryem geri çekildi. “Hayır yapma... ”</p>
<p>Babası bir şey çıkardı. Bir bıçak. Selin, ağacın arkasından izliyordu. Kımıldayamıyordu. Bağıramıyordu. Sadece izliyordu.</p>
<p>Ve sonra... babası Meryem’i kuyuya doğru itti. Meryem düştü. Çığlık atmadı. Sadece... düştü.</p>
<p>Selin, kustu. Sesini çıkarmadan. Ama babası onu duydu. Döndü. Gözleri karanlıktı.</p>
<p>“Selin... kızım... gel buraya.”</p>
<p>Selin kaçmaya çalıştı. Ama babası onu yakaladı. Onu kuyuya doğru sürükledi. “Üzgünüm kızım. Ama babanı ele veremezsin.”</p>
<p>Selin, kuyunun kenarına geldiğinde, annesinin sesini duydu. “Bırak onu! BIRAK!”</p>
<p>Annesi, babasına saldırdı. Bir anlık boşlukta, Selin kendini kuyunun kenarında buldu. Ama düşmedi. Annesi onu tuttu. “Atla, Selin! Atla!”</p>
<p>Selin, kuyuya atladı. Karanlığa. Ama ölmedi. Kuyunun dibinde su vardı. Ve su, onu yumuşakça karşıladı.</p>
<p>Yukarıdan annesinin sesi geldi: “Sakın çıkma! Baban gidene kadar bekle! Sonra seni kurtaracağım!”</p>
<p>Selin, kuyuda üç gün kaldı. Üç gün boyunca annesinin sesini duydu. “Bekle... yakında... ” Ama annesi gelmedi. Onu kurtaran... başka biriydi. O karalanmış kadın. Meryem’in kız kardeşi mi? Yoksa... Meryem’in kendisi mi?</p>
<p>Selin gözlerini açtı. Yağmur başlamıştı. Yüzünden akan suların gözyaşı mı, yağmur mu olduğunu bilmiyordu. Ama bir şey biliyordu: Annesi onu kurtarmamıştı. Annesi onu kuyuya atmıştı. Ve o kuyuda üç gün boyunca... ölümü beklemişti.</p>
<p>Ama ölmemişti. Neden?</p>
<p>Ayağa kalktı. Ormanın derinliklerine baktı. Ve bir şey gördü: Eski bir taş duvar. Yıkık. Ama tanıdık. Bu duvar... kuyunun duvarıydı. Ama bu kuyu, kulübenin yanındaki değildi. Bu... başka bir kuyuydu. Daha eski. Daha derin.</p>
<p>Selin duvara doğru yürüdü. Kuyunun kenarına geldiğinde, içeri baktı. Karanlık. Ama bir şey vardı. Kuyunun dibinde, bir iskelet. İnsan iskeleti. Ve yanında... bir bebek iskeleti.</p>
<p>Selin geri çekildi. Elleri ağzına gitti. “Meryem... ve bebeği... ”</p>
<p>Babası Meryem’i öldürmemişti. Onu buraya, bu kuyuya atmıştı. Ve Meryem bebeğiyle birlikte ölmüştü. Ama bebek canlı doğmuş olmalıydı. Çünkü iskeletin yanında, küçük bir battaniye vardı. Ve battaniyenin üzerinde bir isim işlenmişti: SELİN.</p>
<p>Selin’in dünyası durdu. “Ben Meryem’in bebeği miyim?”</p>
<p>Tam o sırada, arkasında bir ses duydu. “Evet. Sen Meryem’in kızısın.”</p>
<p>Selin döndü. Annesi. Karşısında duruyordu. Yaşlı, yorgun, ama gözleri hâlâ keskin.</p>
<p>“Sen ” Selin’in sesi titredi. “Sen beni kuyuya attın.”</p>
<p>Annesi başını salladı. “Evet. Seni kurtarmak için. Baban seni öldürecekti. Meryem’i öldürdüğü gibi. Ama ben seni kurtaramazdım. Eğer seni kuyuya atmasaydım, baban seni ormanda öldürecekti. Kuyu senin tek şansındı.”</p>
<p>“Üç gün!” Selin bağırdı. “Üç gün boyunca orada kaldım! Sen beni kurtarmaya gelmedin!”</p>
<p>Annesi gözlerini kapadı. “Çünkü baban beni eve kilitledi. Üç gün boyunca. Seni aramaya çalıştım ama yapamadım. Seni kurtaran... Meryem’in kız kardeşiydi. O karalanmış kadın. O o seni buldu. Ve seni bana getirdi.”</p>
<p>Selin başını salladı. “O kadın kim?”</p>
<p>Annesi gözlerini açtı. “O o Meryem’in ikiz kardeşiydi. Adı... Melek’ti. Ve o o babanın ilk kurbanıydı. Ama ölmedi. Kaçtı. Ve yıllarca seni izledi. Seni korudu. Ta ki... ta ki baban onu bulana kadar.”</p>
<p>Selin, annesine baktı. “Babam... Melek’i de mi öldürdü?”</p>
<p>Annesi başını salladı. “Evet. İki yıl önce. Ve Seda bunu öğrendi. Ve baban Seda’yı öldürdü. Çünkü Seda artık susmuyordu.”</p>
<p>Selin, annesine doğru bir adım attı. “Sen neden susuyorsun? Neden polise gitmedin?”</p>
<p>Annesi gülümsedi. Acı bir gülümseme. “Çünkü polis babanın tarafında. Ve ben seni korumak zorundaydım. Ama artık sen büyüdün. Ve artık gerçeği biliyorsun.”</p>
<p>Selin, annesinin elini tuttu. “Anne... ben seni affetmiyorum. Ama seni anlıyorum.”</p>
<p>Annesi gözyaşlarına boğuldu. “Selin... kızım... ben seni çok sevdim. Ve seni korumak için... her şeyi yaptım.”</p>
<p>Selin, annesini kucakladı. Ama içinde bir ses vardı. O ses, hâlâ fısıldıyordu: Ama Seda öldü. Ve sen hâlâ karanlıktasın.</p>
<h2 class='chapter'>Bölüm 8: İti̇raf</h2>
<p>Polis sireni yaklaşırken, Selin annesini kulübenin arkasına götürdü. “Anne, burada kal. Ben polisle konuşacağım.”</p>
<p>Annesi onu durdurdu. “Selin... baban polise her şeyi anlatacak. Seni suçlayacak. Çünkü o o bir yalancı.”</p>
<p>Selin başını salladı. “Biliyorum. Ama artık onun yalanlarına kanacak kimse yok.”</p>
<p>Polis arabaları kulübenin önünde durduğunda, Selin kollarını kaldırdı. “Ben teslim oluyorum. Ama babam bir katil.”</p>
<p>Komiser, yaşlı, yorgun bir adamdı. “Kızım... baban zaten burada. Ve senin hakkında bir şeyler söylüyor. ‘Kızım beni öldürmeye çalıştı’ diyor.”</p>
<p>Selin güldü. “Tabii ki. Çünkü o o her zaman kurbanı oynar. Ama bu sefer... bu sefer kanıt var.”</p>
<p>Komiser kaşlarını çattı. “Ne kanıtı?”</p>
<p>Selin, ormandaki kuyuyu işaret etti. “Orada Meryem’in cesedi var. Ve bebeğinin. Babam onları öldürdü. Ve Seda’yı da o öldürdü.”</p>
<p>Komiser, adamlarına işaret etti. “Kuyuyu kontrol edin.”</p>
<p>Birkaç dakika sonra, polisler geri döndü. Yüzleri bembeyazdı. “Komiserim... orada iki iskelet var. Biri yetişkin bir kadın. Diğeri bir bebek.”</p>
<p>Komiser, Selin’e döndü. “Kızım... sen bunu nereden biliyordun?”</p>
<p>Selin, annesinin saklandığı yeri işaret etti. “Annem her şeyi biliyor. Ve babam şu anda kaçıyor.”</p>
<p>Polisler, babasını aramaya başladı. Ama babası çoktan kaybolmuştu. Ormanın derinliklerinde. Karanlıkta.</p>
<p>O gece, Selin karakolda ifade verdi. Annesi de. Ve teyzesi de. Hepsi aynı şeyi söylüyordu: Baba, bir katildi. Ve yıllarca herkesi korkutmuştu.</p>
<p>Sabaha karşı, Selin karakoldan çıktı. Kerem onu bekliyordu. “Selin... seni eve götüreyim.”</p>
<p>Selin başını salladı. “Hayır. Ben kuyuya gitmek istiyorum.”</p>
<p>Kerem ona baktı. “Neden?”</p>
<p>“Çünkü Seda orada. Ve ben onunla konuşmalıyım.”</p>
<p>Kerem, onu kuyuya götürdü. Kuyu, artık polis şeridiyle çevrilmişti. Ama Selin, şeridin altından geçti. Kuyunun kenarına oturdu. Ve aşağıya baktı.</p>
<p>“Merhaba Seda,” dedi fısıltıyla. “Ben geldim. Ve artık biliyorum. Her şeyi.”</p>
<p>Kuyudan bir ses geldi. Yoksa Selin’in hayal gücü müydü? Ama bir ses vardı. Seda’nın sesi:</p>
<p>“Ablam... beni affediyor musun?”</p>
<p>Selin gözyaşlarını sildi. “Seni affediyorum. Ama kendimi affedemiyorum. Çünkü ben seni kurtaramadım.”</p>
<p>“Hayır, ablam. Sen beni kurtardın. O gece... o gece beni kuyuya atmadın. Ben kendim düştüm. Ve sen beni çıkarmaya çalıştın. Ama ben çok korktum. Ve seni ittim.”</p>
<p>Selin’in gözleri büyüdü. “Ne?”</p>
<p>“O gece, ablam... babam beni kuyuya attı. Ve sen beni kurtarmaya geldin. Ama ben panikledim. Ve seni ittim. Sen kuyuya düştün. Ve ben seni kurtaramadım. Bu yüzden... bu yüzden yıllarca kendimi suçladım. Ama sen beni affet. Lütfen.”</p>
<p>Selin, kuyuya baktı. Karanlığa. Ve karanlıkta, bir çift göz gördü. Seda’nın gözleri. Ama Seda ölmüştü. Değil mi?</p>
<p>“Kerem,” dedi Selin titreyen sesle. “Sen Seda’yı kuyuya attığını söylemiştin.”</p>
<p>Kerem yanına geldi. “Evet. Ben onu kuyuya attım. Ama o zaten ölmüştü. Kalp krizi. Ben sadece cesedi sakladım.”</p>
<p>Selin ona baktı. “O zaman... o zaman kuyudaki ses... kimin sesi?”</p>
<p>Kerem cevap vermedi. Sadece kuyuya baktı. Ve kuyudan bir ses daha geldi. Bu sefer... bir çocuk sesi:</p>
<p>“Ablam... beni neden bıraktın?”</p>
<p>Selin, kuyunun kenarından geri çekildi. “Bu benim sesim.”</p>
<p>Kerem başını salladı. “Evet. Sen hâlâ o kuyudasın, Selin. Ve çıkmak için... çıkmak için kendini affetmelisin.”</p>
<p>Selin, kuyuya son bir kez baktı. Ve karanlıkta, bir şey gördü. Kendisini. Sekiz yaşındaki halini. Korkmuş, yalnız, ama hayatta. Ve o çocuk, şimdi ona gülümsüyordu.</p>
<p>“Seni affediyorum,” dedi Selin. Kendine. “Ve artık çıkıyorum.”</p>
<p>Ayağa kalktı. Kerem’e döndü. “Ben hazırım. Eve dönelim.”</p>
<p>Kerem gülümsedi. “Tamam. Ama bir şey daha var.”</p>
<p>Kerem cebinden bir mektup çıkardı. “Bu Seda’nın mektubu. Ölümünden sonra. Bir avukat getirdi. Sana.”</p>
<p>Selin mektubu açtı. Seda’nın el yazısı:</p>
<p>“Ablam,</p>
<p>Eğer bunu okuyorsan, ben artık yokum. Ama sen varsın. Ve sen artık her şeyi biliyorsun. Babamız bir canavar. Ama biz onun kızları değiliz. Biz Meryem’in kızlarıyız. Ve Meryem bize bir şey bıraktı. Bir miras. Bir görev. Karanlıkta kalanları... kurtarmak.</p>
<p>Ben yapamadım. Ama sen yapabilirsin. Çünkü sen her zaman daha güçlüydün. Ben sadece korkak bir kızdım.</p>
<p>Beni affet. Ve kendini affet. Çünkü sen masumsun.</p>
<p>Sonsuza kadar, Seda.”</p>
<p>Selin mektubu göğsüne bastırdı. Ve o an, ilk kez, karanlıkta bir ışık gördü. Küçük, zayıf, ama gerçek.</p>
<h2 class='chapter'>Bölüm 9: Yeni̇ Bi̇r Başlangiç</h2>
<p>Üç ay geçti. Baba, yakalandı. Ormanda, açlıktan ve yorgunluktan bitap düşmüş halde bulundu. Mahkeme, onu ömür boyu hapse mahkûm etti. Meryem’in ve bebeğinin cinayetinden. Ve Seda’nın ölümüne sebebiyet vermekten.</p>
<p>Annesi, itirafçı oldu. Meryem’in ölümüne yardım ettiği için, beş yıl hapis cezası aldı. Ama Selin, onu affetti. Çünkü annesi, onu kurtarmak için her şeyi yapmıştı.</p>
<p>Kerem, Seda’nın ölümünden sorumlu tutuldu. Ama Selin, onun lehine tanıklık etti. “O o Seda’yı öldürmedi. Sadece korkuttu. Ve Seda zaten ölmek üzereydi.”</p>
<p>Kerem, iki yıl hapis cezası aldı. Ama Selin, onu bekleyeceğine söz verdi.</p>
<p>Selin, kasabada kaldı. Teyzesinin evinde. Ve yeni bir hayat kurmaya başladı. Bir psikologla görüşüyordu. Anılarını, yavaş yavaş, sindiriyordu.</p>
<p>Bir gün, teyzesinin tavan arasında, eski bir sandık buldu. İçinde... Meryem’in günlüğü vardı. Ve son sayfada, Meryem’in el yazısıyla:</p>
<p>“Eğer bu günlüğü okuyan varsa, bilin ki: Ben ölmedim. Ben kaçtım. Ve kızım Selin... o o hâlâ yaşıyor. Onu koruyun. Çünkü o o bizim tek umudumuz.”</p>
<p>Selin, günlüğü kapadı. Ve pencereden dışarı baktı. Kuyu... hâlâ oradaydı. Ama artık korkmuyordu. Çünkü artık biliyordu: Karanlıkta kalan, sadece kendisi değildi. Ve karanlık her zaman geçerdi.</p>
<h2 class='chapter'>Bölüm 10: Hi̇pnoz</h2>
<p>Dr. Aylin’in muayenehanesi, kasabanın merkezindeki eski bir binanın ikinci katındaydı. Pencereden, sisli sokaklar ve ıslak kaldırımlar görünüyordu. Selin, koltuğa oturduğunda, kalbi hızla çarpıyordu.</p>
<p>“Emin misin?” diye sordu Dr. Aylin. Kadın, ellili yaşlarında, sakin ve güven verici bir sesi vardı. “Bazı anılar... açıldığında, kapanmaz. Ve bazı kapılar... bir kez açıldığında, bir daha asla kapanmaz.”</p>
<p>Selin başını salladı. “Eminim. On beş yıldır... on beş yıldır bu kapının arkasında yaşıyorum. Artık içeri girmek istiyorum.”</p>
<p>Dr. Aylin, ışıkları kıstı. “Tamam. Rahatla. Nefes al. Ve beni dinle.”</p>
<p>Selin gözlerini kapadı. Dr. Aylin’in sesi, yavaş yavaş, bir nehir gibi aktı. “Şimdi... geri gidiyorsun. 1998 yazına. Ağustos ayına. Hava sıcak. Kuşlar ötüyor. Ve sen ormanda yürüyorsun. Babanla.”</p>
<p>Selin’in nefesi değişti. Gözlerinin arkasında bir görüntü belirdi: Ağaçlar, güneş ışığı, babasının eli. “Evet ormandayım.”</p>
<p>“Nereye gidiyorsunuz?”</p>
<p>“Kuyuya. Babam ‘avlanmaya’ dedi. Ama av yok. Sadece bir kadın var. Meryem.”</p>
<p>Dr. Aylin’in sesi sakin kaldı. “Meryem ne yapıyor?”</p>
<p>“Babamla tartışıyor. ‘Bunu yapamazsın’ diyor. ‘Çocuk büyüyor.’ Babam gülüyor. Ve bıçağını çıkarıyor.”</p>
<p>Selin’in elleri titremeye başladı. Dr. Aylin, onu sakinleştirdi. “Sakin ol. Sadece izle. Bir film gibi. Ne oluyor?”</p>
<p>“Babam Meryem’i kuyuya atıyor. Ama Meryem düşmüyor. Tutunuyor. Babam onun ellerine basıyor. Ve Meryem düşüyor.”</p>
<p>“Sen neredesin?”</p>
<p>“Ben bir ağacın arkasındayım. Kımıldayamıyorum. Bağıramıyorum. Sadece izliyorum.”</p>
<p>“Sonra ne oluyor?”</p>
<p>“Babam bana bakıyor. ‘Selin’ diyor. ‘Kızım. Gel buraya.’ Ben kaçmaya çalışıyorum. Ama babam beni yakalıyor.”</p>
<p>“Seni nereye götürüyor?”</p>
<p>“Kuyuya. Beni kuyuya itiyor. Ama ben düşmüyorum. Bir şeye tutunuyorum. Bir köke.”</p>
<p>“Sonra?”</p>
<p>“Annem geliyor. Babama saldırıyor. ‘Bırak onu!’ diye bağırıyor. Ve ben kuyuya düşüyorum. Ama kuyuda biri var.”</p>
<p>Selin’in nefesi kesildi. Dr. Aylin öne eğildi. “Kim var, Selin? Kuyuda kim var?”</p>
<p>“Seda. Seda var. O o da kuyuda. Ama nasıl? O o iki yaşındaydı. Neden kuyuda?”</p>
<p>“Seda ne yapıyor?”</p>
<p>“Ağlıyor. ‘Ablam’ diyor. ‘Ablam beni kurtar.’ Ben ona sarılıyorum. Ama su yükseliyor. Ve Seda nefes alamıyor. Ben onu yukarı itmeye çalışıyorum. Ama yapamıyorum. Çok ağır. Ve su çok soğuk.”</p>
<p>“Sonra?”</p>
<p>“Bir ses. Yukarıdan bir ses. Bir kadın. ‘Selin! Seda! Tutunun!’ Ve bir ip sarkıyor. Ben Seda’yı ipe bağlıyorum. Ve kadın Seda’yı yukarı çekiyor. Sonra ip tekrar sarkıyor. Ama ben tutamıyorum. Ellerim kayıyor. Ve karanlık.”</p>
<p>Selin’in gözleri açıldı. Nefes nefese kalmıştı. Dr. Aylin, ona su uzattı. “Sakin ol. Nefes al. Yavaşça.”</p>
<p>Selin suyu içti. Elleri hâlâ titriyordu. “Yani Seda da kuyudaydı. Ve ben onu kurtardım. Ama neden? Neden Seda kuyudaydı? Onu kim attı?”</p>
<p>Dr. Aylin notlarını aldı. “Belki de... belki de Seda kendi düştü. Senin peşinden. Çocuklar bazen tehlikeli şeyler yapar. Özellikle de kardeşlerini korumak için.”</p>
<p>Selin başını salladı. “Ama Seda iki yaşındaydı. Nasıl kuyuya düşebilir?”</p>
<p>Dr. Aylin ona baktı. “Selin... belki de Seda iki yaşında değildi. Belki de... belki de daha büyüktü. Ve belki de... belki de o gün, sadece sen kuyuya düşmedin. Belki de... belki de Seda da o kuyuda üç gün kaldı. Ve belki de... belki de o üç gün, onun da anılarını değiştirdi.”</p>
<p>Selin gözlerini kapadı. “Yani Seda da... Seda da travma yaşadı?”</p>
<p>“Evet. Ve belki de... belki de Seda’nın ‘delirmesi’ dediğin şey, aslında onun travmasıydı. Ve belki de... belki de Seda, yıllarca, o kuyuda kalmış gibi hissetti. Tıpkı senin gibi.”</p>
<p>Selin ayağa kalktı. “O zaman... o zaman Seda’nın ölümü... Seda’nın ölümü bir intihar değil. O o hâlâ kuyuda. Ve ben onu kurtarmalıyım.”</p>
<p>Dr. Aylin başını salladı. “Evet. Ama önce kendini kurtarmalısın.”</p>
<h2 class='chapter'>Bölüm 11: Kerem’İn Sirri</h2>
<p>Selin, Dr. Aylin’in muayenehanesinden çıktığında, Kerem’i kapının önünde buldu. Sigara içiyordu. Yüzü, her zamankinden daha solgundu.</p>
<p>“Kerem... sen burada ne arıyorsun?”</p>
<p>Kerem sigarasını söndürdü. “Seni bekliyordum. Çünkü bir şey söylemem lazım. Ve bu sefer... bu sefer yalan söylemeyeceğim.”</p>
<p>Selin ona baktı. “Ne yalanı?”</p>
<p>Kerem derin bir nefes aldı. “Seda ölmedi.”</p>
<p>Selin’in dünyası durdu. “Ne?”</p>
<p>“Seda ölmedi. Komada. Bir hastanede. Trabzon’da. Üç aydır... üç aydır orada.”</p>
<p>Selin, duvara tutundu. “Nasıl olur? Sen bana Seda’nın öldüğünü söyledin. Polis ölü bulundu dedi.”</p>
<p>Kerem başını öne eğdi. “Çünkü ben yalan söyledim. Seda’nın evinde bulunan ceset... Seda değildi. Bir başkasıydı. Baban bir kadın cesedi getirmiş, Seda’nın evine koymuş. Polis de kimliği tespit edemeyince, baban ‘Bu Seda’ dedi. Ve polis ona inandı. Çünkü baban onların muhbiriydi.”</p>
<p>Selin’in midesi bulandı. “Peki gerçek Seda nerede?”</p>
<p>Kerem gözlerini kaldırdı. “Ben onu kuyuda buldum. Ölü sanmıştım. Ama nefes alıyordu. Zayıf, ama yaşıyordu. Onu hastaneye götürdüm. Samsun’a. Orada komaya girdi. Ve üç aydır... üç aydır uyanmadı.”</p>
<p>Selin, Kerem’e doğru bir adım attı. “Sen neden bana söylemedin?”</p>
<p>Kerem’in gözleri doldu. “Çünkü korktum. Ben Seda’yı kuyuya attım. Onu öldü sanarak. Ama o yaşıyordu. Ve eğer polis öğrenirse... eğer baban öğrenirse... Seda’yı öldürürlerdi. Ben onu korumak için... yalan söyledim.”</p>
<p>Selin, Kerem’e baktı. Yıllardır ilk kez, ona acıdı. “Kerem... sen Seda’yı seviyordun, değil mi?”</p>
<p>Kerem başını salladı. Gözyaşları yanaklarından akıyordu. “Evet. Ve onu kurtaramadım. Ama şimdi onu kurtarabiliriz. Eğer sen istersen.”</p>
<p>Selin, Kerem’in elini tuttu. “Ben Seda’yı görmek istiyorum. Şimdi.”</p>
<h2 class='chapter'>Bölüm 12: Komadaki̇ Kiz</h2>
<p>Samsun’daki hastane, kasabadan iki saat uzaklıktaydı. Yol boyunca Selin, camdan dışarıyı izledi. Ama hiçbir şey görmüyordu. Sadece Seda’nın yüzü vardı gözlerinin önünde. Küçük, korkmuş, kuyuda ağlayan Seda.</p>
<p>Hastaneye vardıklarında, akşam olmuştu. Kerem, onu yoğun bakıma götürdü. Kapının önünde durdu. “Ben burada bekleyeyim. Sen yalnız git. Belki seni duyar.”</p>
<p>Selin, kapıyı açtı. İçeride, makinelerin sesi vardı. Ve yatakta... Seda. Solgun, zayıf, ama nefes alıyordu. Selin yanına oturdu. Elini tuttu. Soğuktu.</p>
<p>“Seda,” dedi fısıltıyla. “Ben geldim. Ablan geldi.”</p>
<p>Seda’nın gözleri kapalıydı. Ama parmakları, hafifçe, Selin’in elini sıktı. Selin’in gözyaşları, Seda’nın eline damladı.</p>
<p>“Seda... ben seni affediyorum. Ve kendimi de. Çünkü ikimiz de... ikimiz de kuyudaydık. Ama artık çıkıyoruz. İkimiz de.”</p>
<p>Bir sessizlik oldu. Sonra... Seda’nın gözleri açıldı. Mavi, berrak, ama karanlık. Seda, Selin’e baktı. Ve gülümsedi. Ama bu gülümseme, Selin’in tanıdığı gülümseme değildi. Bu gülümseme... soğuktu.</p>
<p>“Ablam,” dedi Seda. Sesi, kısık ve yorgundu. “Sen buraya geldin. Ama ben seni beklemiyordum.”</p>
<p>Selin ona daha sıkı sarıldı. “Seda... ben seni kurtarmaya geldim.”</p>
<p>Seda güldü. Acı bir kahkaha. “Kurtarmaya mı? Ablam... ben zaten kurtuldum. Beni babam kurtardı.”</p>
<p>Selin geri çekildi. “Ne?”</p>
<p>Seda doğrulmaya çalıştı. Ama zayıftı. “Babam... beni o kuyudan çıkardı. Kerem beni orada bıraktı. Ölü sanarak. Ama babam beni buldu. Ve beni buraya getirdi. Bu hastaneye. Ve beni iyileştirdi.”</p>
<p>Selin’in dünyası tekrar yıkıldı. “Seda... sen ne diyorsun? Baban bir katil. O o Meryem’i öldürdü. O o seni öldürmeye çalıştı.”</p>
<p>Seda başını salladı. “Hayır. Hayır, ablam. Babam beni korudu. Sen yanlış biliyorsun. Babam iyi bir adam. O o sadece... o sadece yanlış anlaşıldı.”</p>
<p>Selin ayağa kalktı. “Seda... sen şoktasın. Hastasın. Bunları söylememelisin.”</p>
<p>Seda güldü. “Hasta mıyım? Hayır, ablam. Ben hiç bu kadar iyi olmamıştım. Çünkü artık biliyorum. Gerçeği. Ve sen de öğreneceksin.”</p>
<p>Selin, Seda’ya baktı. Kardeşinin gözlerinde, bir şey vardı. Nefret. Ve zafer.</p>
<p>“Ne öğreneceğim?”</p>
<p>Seda, yatağın altından bir şey çıkardı. Bir bıçak. “Sen Meryem’in kızısın, değil mi? Babam bana her şeyi anlattı. Sen Meryem’in kızısın. Ve Meryem babamı öldürmeye çalıştı. Ama babam kendini savundu. Ve sen o kadının kızısın. Ve şimdi ben seni öldüreceğim.”</p>
<p>Selin geri çekildi. “Seda... dur. Ben senin ablanım.”</p>
<p>Seda güldü. “Hayır. Sen benim ablam değilsin. Sen bir yabancısın. Ve yabancılar ölür.”</p>
<p>Seda bıçağı kaldırdı. Ama zayıftı. Elleri titriyordu. Selin, onu durdurdu. Bıçağı aldı. Seda’yı kucakladı.</p>
<p>“Seda... sen kafan karışmış. Ama ben seni seviyorum. Ve seni iyileştireceğim. Söz veriyorum.”</p>
<p>Seda direndi. Ama sonra gözyaşlarına boğuldu. “Ablam... ben çok korkuyorum. Babam bana her şeyi anlattı. Ve ben artık kim olduğumu bilmiyorum.”</p>
<p>Selin onu sımsıkı tuttu. “Biliyorum. Ama ben biliyorum. Sen benim kardeşimsin. Ve biz birlikte iyileşeceğiz.”</p>
<p>O gece, Selin hastanede kaldı. Seda uyuduğunda, Kerem’e döndü:</p>
<p>“Kerem... babam Seda’yı zehirlemiş. Kafasını yıkamış. Ona yalanlar söylemiş.”</p>
<p>Kerem başını salladı. “Biliyorum. Ve bu daha da tehlikeli. Çünkü Seda artık babanın bir silahı.”</p>
<p>Selin, Seda’ya baktı. “O zaman... o zaman onu silahsızlandırmalıyız. Ve babamı bir kez daha durdurmalıyız.”</p>
<h2 class='chapter'>Bölüm 13: Uyurgezer</h2>
<p>Seda’yı hastaneden çıkarmak, Selin’in hayatında aldığı en zor kararlardan biriydi. Doktorlar, Seda’nın fiziksel olarak iyileştiğini ama zihinsel durumunun hâlâ kırılgan olduğunu söylüyordu. “Travma sonrası stres bozukluğu,” demişti doktor. “Ve muhtemelen... bir tür telkin. Biri onun bilinçaltına yerleşmiş.”</p>
<p>Selin, bu “biri”nin kim olduğunu biliyordu. Babası.</p>
<p>Teyzesinin evine döndüklerinde, Seda ilk birkaç gün sessizdi. Yemek yiyor, uyuyor, ama konuşmuyordu. Gözleri boş bakıyordu. Selin, onu her fırsatta kucaklıyor, “Buradayım,” diyordu. “Seni bırakmayacağım.”</p>
<p>Ama üçüncü gece, bir şey oldu.</p>
<p>Selin, gece yarısı bir sesle uyandı. Kapı gıcırdıyordu. Yataktan kalktı, koridora çıktı. Seda, pijamalarıyla, çıplak ayakla merdivenlerden iniyordu. Gözleri açıktı ama boştu. Uyurgezerdi.</p>
<p>“Seda?” Selin seslendi. Cevap yok. Seda, arka kapıya yöneldi. Kapıyı açtı. Soğuk gece havası içeri doldu.</p>
<p>Selin, onu durdurmak için koştu. “Seda! Dur!”</p>
<p>Seda, arka bahçeye çıktı. Kuyuya doğru yürüyordu. Ay ışığında, yüzü bembeyazdı. Ve dudaklarından bir şey döküldü:</p>
<p>“Babam beni çağırıyor. Kuyuya. O o orada.”</p>
<p>Selin, onu kolundan tuttu. “Seda, uyan! Babam orada değil. Babam hapiste.”</p>
<p>Seda, sanki onu duymuyordu. Kuyunun kenarına geldi. Eğildi. Aşağıya baktı. “Babam diyor ki... ‘Gel kızım. Gel. Ve ablanı da getir.’”</p>
<p>Selin, onu kuyudan çekti. “Seda! Bak bana!”</p>
<p>Seda’nın gözleri bir an odaklandı. Sonra... korkuyla açıldı. “Ablam... ben neredeyim?”</p>
<p>“Kuyunun yanındasın. Yine. Seda, sen uyurgezerlik yapıyorsun. Babam seni çağırıyor. Ama o o sadece bir ses. Bir yalan.”</p>
<p>Seda titremeye başladı. “Ama o kadar gerçek ki. Her gece... her gece rüyamda... beni kuyuya çağırıyor. Ve ben ona gitmek istiyorum.”</p>
<p>Selin, onu sımsıkı kucakladı. “Hayır. Hayır, gitmeyeceksin. Ben seni koruyacağım.”</p>
<p>O gece, Selin, Seda’nın yatağının yanında uyudu. Ve sabah olduğunda, Dr. Aylin’i aradı. “Seda iyi değil. Babam onun beynine bir şey yerleştirmiş. Ve ben ne yapacağımı bilmiyorum.”</p>
<p>Dr. Aylin, sakin bir sesle cevap verdi: “Selin... Seda’nın bir uzmana ihtiyacı var. Ama daha da önemlisi... Seda’nın babasıyla yüzleşmesi gerekiyor. Kafasındaki o sesi... o sesin sahibiyle yüzleştirmeden susturamazsın.”</p>
<p>Selin gözlerini kapadı. “Yani onu hapishaneye mi götürmeliyim?”</p>
<p>“Evet. Ama kontrollü bir ortamda. Ve senin de orada olman gerek. Çünkü Seda o adamın karşısında tek başına duramaz.”</p>
<h2 class='chapter'>Bölüm 14: Mektup</h2>
<p>Ertesi gün, postacı bir zarf getirdi. Üzerinde hapishane damgası vardı. Selin, zarfı açtığında, babasının el yazısını gördü. Yıllardır ilk kez. Ve midesi bulandı.</p>
<p>“Selin,</p>
<p>Kızım. Evet, sana hâlâ kızım diyorum. Çünkü sen benim kanımsın. Meryem’in değil. Benim.</p>
<p>Seda’yı bana getir. Onu görmek istiyorum. Ve eğer getirirsen... sana bir şey vereceğim. Bir şey ki... tüm gerçeği öğreneceksin. Meryem’in gerçeğini. Ve annenin gerçeğini.</p>
<p>Ama yalnız gel. Kerem’i getirme. Çünkü Kerem bir yalancı. Ve yalancılar cezalandırılır.</p>
<p>Baban.”</p>
<p>Selin, mektubu masaya bıraktı. Elleri titriyordu. Seda, kapıda duruyordu. “Ne yazıyor?”</p>
<p>Selin ona baktı. “Babam... baban seni görmek istiyor. Ve eğer gidersek... gerçeği anlatacağını söylüyor.”</p>
<p>Seda’nın gözleri parladı. “Gidelim. Ablam... gidelim. Ben onu görmek istiyorum.”</p>
<p>Selin başını salladı. “Ama Seda... o o bir katil. O o seni kullandı.”</p>
<p>Seda, Selin’e yaklaştı. “Biliyorum. Ama o benim babam. Ve ben onunla konuşmadan... bu sesi susturamam.”</p>
<p>Selin, bir an düşündü. Sonra Kerem’i aradı. Kerem, itiraz etti. “Bu bir tuzak. Baban, Seda’yı kullanarak seni de içeri çekecek.”</p>
<p>“Biliyorum. Ama Seda’sız yapamam. Ve eğer gerçeği öğrenmek istiyorsam... bu riski almalıyım.”</p>
<p>Kerem derin bir nefes aldı. “Tamam. Ama ben de geleceğim. Görünmez bir şekilde. Hapishanenin dışında bekleyeceğim. Eğer bir sorun olursa... seni çıkarırım.”</p>
<p>Selin başını salladı. “Anlaştık.”</p>
<h2 class='chapter'>Bölüm 15: Yüzleşme</h2>
<p>Trabzon Cezaevi’nin görüşme odası, gri duvarlı ve soğuktu. Selin ve Seda, masanın bir tarafına oturdu. Karşı tarafta... baba. Yaşlı, yorgun, ama gözleri hâlâ keskin. Ve tehlikeli.</p>
<p>Seda, onu görünce dondu kaldı. Elleri titriyordu. Selin, onun elini tuttu. “Buradayım,” dedi fısıltıyla. “Yanındayım.”</p>
<p>Baba gülümsedi. “Kızlarım. İki kızım. Yan yana. Ne güzel.”</p>
<p>Selin, ona dik dik baktı. “Bize gerçeği anlat. Mektubunda... gerçeği anlatacağını söyledin.”</p>
<p>Baba başını salladı. “Evet. Ama önce... Seda’nın benimle yalnız konuşması lazım.”</p>
<p>Selin itiraz etti. “Hayır. Seda seninle yalnız konuşmayacak.”</p>
<p>Baba güldü. “Selin... sen hâlâ korkuyorsun. Korkunç bir şey değil. Sadece... bir baba ve kızı. Özel bir an.”</p>
<p>Seda, Selin’e döndü. “Ablam... izin ver. Ben konuşmak istiyorum.”</p>
<p>Selin tereddüt etti. Sonra... başını salladı. “Ama kapıda olacağım. Ve eğer bir şey olursa... ”</p>
<p>“Biliyorum.” Seda gülümsedi. Zayıf bir gülümseme. “Sen benim ablamsın. Ve ben seni seviyorum.”</p>
<p>Selin, odadan çıktı. Kapıyı aralık bıraktı. Ve dinledi.</p>
<p>Baba, Seda’ya döndü. “Kızım... seni çok özledim.”</p>
<p>Seda, gözyaşları içinde ona sarıldı. “Baba... ben seni seviyorum. Ama sen kötü bir şey yaptın. Meryem’i... Meryem’i öldürdün.”</p>
<p>Baba başını salladı. “Evet. Ama o o hak etti. Meryem beni kandırdı. Beni kullandı. Ve senin anneni... senin anneni öldürdü.”</p>
<p>Seda geri çekildi. “Ne? Benim annem... ?”</p>
<p>Baba, cebinden eski bir fotoğraf çıkardı. Fotoğrafta, genç bir kadın vardı. Seda’ya benziyordu. “Bu senin annen. Adı... Ayşe. Ve Meryem onu öldürdü. Çünkü ben Ayşe’yi seviyordum. Ve Meryem beni istiyordu. O yüzden... o yüzden Ayşe’yi öldürdü.”</p>
<p>Seda’nın dünyası yıkıldı. “Yani Meryem bir katil miydi?”</p>
<p>Baba başını salladı. “Evet. Ve senin ablan... Selin... o Meryem’in kızı. Ve Meryem Selin’i bile istemedi. Onu kuyuya attı. Ben kurtardım. Ben seni de kurtardım. Çünkü ben iyi bir babayım.”</p>
<p>Seda, başını salladı. “Ama sen de insan öldürdün.”</p>
<p>Baba gülümsedi. “Sadece kötü insanları. Ve bazen iyi insanlar da... yanlışlıkla ölür. Ama ben pişmanım. Ve senden beni affetmeni istiyorum.”</p>
<p>Seda, ona baktı. Gözlerinde... nefret vardı. Ama aynı zamanda... sevgi. “Seni affetmiyorum. Ama seni anlıyorum.”</p>
<p>Baba güldü. “Bu yeterli. Şimdi git. Ve ablanla konuş. Ona gerçeği anlat. Meryem’in gerçeğini.”</p>
<p>Seda ayağa kalktı. Kapıya yürüdü. Ama tam çıkarken, baba seslendi:</p>
<p>“Seda... bir şey daha. Ablan Meryem’in kızı. Ama o o senin kardeşin değil. Çünkü sen benim kızımsın. Ama Selin... Meryem’in kızı. Ve Meryem bir fahişeydi. Ve senin ablan... senin ablan bir orospu çocuğu.”</p>
<p>Seda dondu kaldı. Kapının arkasında, Selin de duymuştu. Elleri yumruk oldu. Ama içeri girmedi. Sadece bekledi.</p>
<p>Seda, babasına döndü. Yüzü... ifadesizdi. “Sen kötü bir adamsın. Ve ben senin kızın olmaktan utanç duyuyorum.”</p>
<p>Baba güldü. “Ama sen benim kanımsın. Ve kan asla değişmez.”</p>
<p>Seda, odadan çıktı. Selin’i gördü. Gözyaşları içindeydi. “Ablam... ben özür dilerim. O o bir canavar. Ve ben ona inandım.”</p>
<p>Selin, onu kucakladı. “Sorun değil. Sorun değil. Artık biliyoruz. Ve artık daha güçlüyüz.”</p>
<p>Ama Selin’in içinde bir şüphe vardı. Babasının söyledikleri... doğru olabilir miydi? Meryem gerçekten bir katil miydi? Ve Selin gerçekten Meryem’in kızı mıydı? Yoksa baba yine yalan mı söylüyordu?</p>
<h2 class='chapter'>Bölüm 16: Günlükteki̇ Boşluk</h2>
<p>Selin, teyzesinin evine döndüklerinde gece yarısını çoktan geçmişti. Seda, hastaneden taburcu edilmiş ama hâlâ bitkindi. Selin onu yatağa yatırdı, üstünü örttü. Seda uykuya dalarken bile parmakları Selin’in elini sıkı sıkı tutuyordu.</p>
<p>“Seda... ben buradayım. Uyu.”</p>
<p>Seda’nın nefesi yavaşladı. Selin, kapıyı sessizce kapattı ve aşağıya, teyzesinin çalışma odasına indi. Meryem’in günlüğü hâlâ sandıktaydı. Onu aldı, masaya koydu. Ve baştan sona, bu sefer notlar alarak okumaya başladı.</p>
<p>İlk sayfalar, Meryem’in gençliğine aitti. Hayaller, korkular, aşklar. Sonra... baba. Meryem, ondan nefret ediyordu ama aynı zamanda... korkuyordu. “O adam beni mahvedecek,” diye yazmıştı bir yerde. “Ama elimden bir şey gelmiyor. Çünkü o o her şeyi biliyor.”</p>
<p>Selin, sayfaları çevirdi. Bir isim arıyordu: Ayşe. Ama yoktu. Ne bir kez, ne bir ima. Meryem, günlüğünde onlarca kişiden bahsediyordu: annesi, kız kardeşi Melek, komşular, doktorlar. Ama Ayşe yoktu.</p>
<p>Selin, sayfaları hızla çevirdi. Sonra... bir sayfa buldu. Yırtılmıştı. Dikkatlice yapıştırılmıştı ama izler belliydi. Ve o sayfada, tek bir cümle okunabiliyordu:</p>
<p>“... Ayşe’yi bulduğumda, artık çok geçti. Baba onu çoktan... ”</p>
<p>Cümlenin devamı yoktu. Selin, sayfayı inceledi. Yırtılan kısım, sanki biri tarafından koparılmıştı. Kim? Meryem mi? Yoksa... baba mı?</p>
<p>Selin, günlüğü kapadı. İçinde bir his vardı: Babası yalan söylüyordu. Ayşe diye biri yoktu. Ya da... varsa bile, Meryem onu öldürmemişti. Belki de Ayşe, babanın başka bir kurbanıydı.</p>
<p>Kapı çaldı. Selin irkildi. Saat sabahın üçüydü. Kim gelirdi ki?</p>
<p>Kapıya gitti. Zinciri takmadan açtı. Karşısında... Kerem. Yüzü bembeyazdı. Elinde bir dosya vardı.</p>
<p>“Kerem... ne oldu?”</p>
<p>Kerem içeri girdi, kapıyı arkasından kapadı. “Selin... bir şey buldum. Ama seni korkutmak istemiyorum.”</p>
<p>Selin onu oturma odasına götürdü. “Söyle. Artık korkmuyorum.”</p>
<p>Kerem dosyayı masaya koydu. “Bu Seda’nın hastane kayıtları. Ben gizlice aldım. Seda’nın kanında... yüksek dozda bir ilaç bulunmuş. Adı... ‘Sodyum tiyopental.’”</p>
<p>Selin kaşlarını çattı. “O ne?”</p>
<p>“Doğru kullanıldığında, bir tür anestezik. Ama yanlış kullanıldığında... bir tür doğru söyleme serumu. Ya da... telkin ilacı. İnsanları... manipüle etmek için.”</p>
<p>Selin’in midesi kasıldı. “Yani biri Seda’ya bu ilacı vermiş. Ve onu manipüle etmiş.”</p>
<p>Kerem başını salladı. “Evet. Ve bu ilacın izleri, Seda’nın kanında... üç aydır var. Yani biri, Seda’yı üç aydır zehirliyor.”</p>
<p>Selin ayağa kalktı. “Baba. Baba, hapishanede bile... insanları kullanabiliyor.”</p>
<p>Kerem başını salladı. “Evet. Ve bir şey daha var. Selin... bu ilacı Seda’ya veren kişi... bir doktor. Ve bu doktor... bu doktor, babanın eski bir arkadaşı. Adı... Doktor Cemal.”</p>
<p>Selin gözlerini kapadı. “Doktor Cemal... Bu ismi... bu ismi bir yerden hatırlıyorum.”</p>
<p>Kerem öne eğildi. “Nereden?”</p>
<p>Selin gözlerini açtı. “1998’de... ben kuyudan çıktıktan sonra... annem beni bir doktora götürmüştü. ‘Anılarını silecek’ demişti. O doktorun adı... Cemal’di.”</p>
<h2 class='chapter'>Bölüm 17: Ayşe Yoktu</h2>
<p>Sabah olduğunda, Selin ve Kerem, Doktor Cemal’i aramaya başladı. Ama kasabada kimse onu tanımıyordu. Eski kayıtlara baktılar. Trabzon’daki hastaneleri aradılar. Hiçbir yerde “Doktor Cemal” yoktu.</p>
<p>Selin, sonunda bir fikir buldu. “Kerem... babamın hapishane kayıtlarına bakabilir miyiz? Ziyaretçi listesi... belki orada bir isim vardır.”</p>
<p>Kerem başını salladı. “Ama bu yasal değil. Polis izni gerek.”</p>
<p>Selin ona baktı. “Kerem... ben artık yasal yollarla gitmek istemiyorum. Çünkü yasal yollar... hep babanın tarafında. Ama sen bu kasabada büyüdün. Senin bağlantıların var.”</p>
<p>Kerem derin bir nefes aldı. “Tamam. Ama bir şartla. Eğer bir şey bulursak... polise gideceğiz. Kanıtla.”</p>
<p>Selin başını salladı. “Anlaştık.”</p>
<p>Kerem, akşamüstü elinde bir dosyayla geri döndü. “Buldum. Ama bu seni üzecek.”</p>
<p>Selin dosyayı açtı. İçinde, hapishane ziyaretçi listesi vardı. Son üç ayda, babasını ziyaret eden tek bir kişi vardı: Doktor Cemal Yıldız. Ve bir de Ayşe Yıldız.</p>
<p>Selin dondu kaldı. “Ayşe Yıldız mı?”</p>
<p>Kerem başını salladı. “Evet. Ama bu bir hata olabilir. Çünkü ben bu ismi araştırdım. Ayşe Yıldız... hiç var olmamış. Doğum kaydı yok. Ölüm kaydı yok. Hiçbir şey.”</p>
<p>Selin başını salladı. “Yani babam, sahte bir isim kullanmış. Seda’yı manipüle etmek için. Ve o fotoğraftaki kadın... o kadın gerçek değil. Ya da... ya da başka biri.”</p>
<p>Kerem dosyadan bir fotoğraf çıkardı. “Bu hapishane kamerasından. Ziyaretçi kaydı. Bak.”</p>
<p>Selin fotoğrafa baktı. Bir kadın ve bir adam. Adam... yaşlı, gözlüklü, beyaz önlüklü. Doktor Cemal. Ve kadın... genç, sarışın, Seda’ya benziyor. Ama Selin’in tanıdığı biri değil.</p>
<p>“Bu kadın... bu kadın kim?”</p>
<p>Kerem omuz silkti. “Bilmiyorum. Ama bu kadın, babamla görüşmüş. Ve belki de Seda’ya ilaç veren kişi o.”</p>
<p>Selin, fotoğrafı cebine koydu. “O zaman... o zaman bu kadını bulmalıyız.”</p>
<p>O gece, Selin, Seda’ya gerçeği anlatmaya karar verdi. Seda, yatağında oturuyordu. Gözleri hâlâ yorgundu ama daha berraktı.</p>
<p>“Seda... seninle konuşmam lazım. Babamız bize yalan söyledi. Ayşe diye biri yok. Meryem kimseyi öldürmedi. En azından... Ayşe’yi değil.”</p>
<p>Seda başını salladı. “Biliyorum.”</p>
<p>Selin şaşırdı. “Ne? Nereden biliyorsun?”</p>
<p>Seda, yatağın altından bir defter çıkardı. “Bu benim defterim. Hastanede bana ilaç verdiklerinde... bazen kendimde değildim. Ama bazen her şeyi hatırlıyorum. Ve o kadın... o sarışın kadın... o bana ilaç veriyordu. Ve bana ‘Ayşe’ diyordu. Kendine Ayşe diyordu.”</p>
<p>Selin’in gözleri büyüdü. “Yani o kadın... o kadın kendini Ayşe olarak mı tanıtıyor?”</p>
<p>Seda başını salladı. “Evet. Ve bana diyordu ki: ‘Ben senin annenim. Ve Meryem beni öldürmedi. Ama sen Meryem’in kızısın. Ve Meryem seni istemedi. O yüzden... o yüzden seni bana verdi.’”</p>
<p>Selin’in midesi bulandı. “Bu bir yalan. Seda... Meryem seni istemedi diye bir şey yok. Sen benim kardeşimsin. Ve Meryem ikimizi de sevdi.”</p>
<p>Seda gözyaşlarına boğuldu. “Ama o kadın... o kadar inandırıcıydı ki. Ve ben ona inandım. Çünkü babam da aynı şeyi söylüyordu.”</p>
<p>Selin, Seda’yı kucakladı. “Biliyorum. Ama artık biliyoruz. Ve o kadını bulacağız. Ve onu durduracağız.”</p>
<h2 class='chapter'>Bölüm 18: Kuyuya Dönüş</h2>
<p>Ertesi gün, Selin ve Kerem, sarışın kadını aramaya başladı. Ama kasabada kimse onu tanımıyordu. Ta ki... yaşlı bir eczacı, fotoğrafı görünce dona kalana kadar.</p>
<p>“Bu kadın... bu kadın birkaç ay önce buraya geldi. İlaç aldı. Ama reçetesiz. Ben vermek istemedim. Ama o o beni tehdit etti.”</p>
<p>Selin öne eğildi. “Nerede bulabiliriz onu?”</p>
<p>Eczacı titreyen elleriyle bir adres yazdı. “Bu kasabanın dışında. Eski bir çiftlik evi. Ama dikkatli olun. O kadın... o kadın tehlikeli.”</p>
<p>Selin adresi aldı. Kerem’e döndü. “Hadi.”</p>
<p>Çiftlik evi, ormanın kenarındaydı. Issız, yıkık, ama bacası tütüyordu. İçeride biri vardı.</p>
<p>Selin, kapıyı çaldı. Uzun bir sessizlik oldu. Sonra kapı açıldı. Karşısında... sarışın kadın. Ama bu sefer... gözleri tanıdıktı. Selin onu tanıyordu. Bu kadın... bu kadın, çocukluğunda onu kuyudan çıkaran kadındı. Melek. Meryem’in ikiz kardeşi.</p>
<p>“Sen ” Selin’in sesi titredi. “Sen Melek’sin. Meryem’in kız kardeşi.”</p>
<p>Kadın gülümsedi. “Evet. Ama artık bana Ayşe diyorlar. Çünkü baban bana bu ismi verdi. Ve ben yıllarca onun için çalıştım.”</p>
<p>Selin geri çekildi. “Ne? Sen baban için mi çalışıyorsun?”</p>
<p>Melek başını salladı. “Evet. Ama artık değil. Çünkü ben Seda’yı zehirlemek istemedim. Ama baban beni zorladı. Ve ben yapmak zorunda kaldım.”</p>
<p>Selin’in elleri yumruk oldu. “Sen Seda’ya ilaç verdin. Onu manipüle ettin.”</p>
<p>Melek gözlerini kapadı. “Evet. Ama ben seni kurtardım. O kuyudan. Yıllar önce. Hatırlıyor musun?”</p>
<p>Selin bir an durdu. Evet. Hatırlıyordu. Karanlıkta bir el. Onu yukarı çeken bir el. Ve bir ses: “Korkma. Ben senin teyzeyim.”</p>
<p>“Sen neden baban için çalıştın? O o Meryem’i öldürdü. O o senin kız kardeşini öldürdü.”</p>
<p>Melek’in gözleri doldu. “Çünkü baban beni tehdit etti. ‘Eğer benim için çalışmazsan,’ dedi, ‘seni de öldürürüm. Ve Selin’i de.’ Ben seni korumak için çalıştım. Yıllarca. Ama sonra Seda büyüdü. Ve baban onu kullanmak istedi. Ben karşı çıktım. Ama baban beni dinlemedi.”</p>
<p>Selin, Melek’e baktı. “O zaman... o zaman bize yardım et. Babamı durdurmama yardım et.”</p>
<p>Melek başını salladı. “Tamam. Ama bir şartla. Seda’yı... Seda’yı koruyacağına söz ver.”</p>
<p>Selin başını salladı. “Söz veriyorum.”</p>
<p>Tam o sırada, Seda’nın sesi duyuldu. “Ablam!”</p>
<p>Selin döndü. Seda, ormanın kenarında duruyordu. Elinde... bir bıçak vardı. Ve gözleri boştu.</p>
<p>“Seda... ne yapıyorsun?”</p>
<p>Seda gülümsedi. “Babam beni çağırıyor. Kuyuya. Ve ben gidiyorum.”</p>
<p>Selin, ona doğru koştu. “Seda! Dur!”</p>
<p>Ama Seda, çoktan ormanın içine dalmıştı. Kuyuya doğru. Selin, onu takip etti. Kerem ve Melek de arkalarından geldi.</p>
<p>Kuyunun başında, Seda durdu. Kuyuya baktı. Sonra... bıçağı kaldırdı. “Babam diyor ki... ‘Atla Seda. Ve tüm acılar bitecek.’”</p>
<p>Selin, ona doğru yavaşça yürüdü. “Seda... bıçağı bırak. Ve bana bak.”</p>
<p>Seda, Selin’e baktı. Gözlerinde... korku vardı. “Ablam... ben çok yoruldum. Her gün... her gün o ses. Babamın sesi. Ve o kadının sesi. Ve ben artık dayanamıyorum.”</p>
<p>Selin, onun elini tuttu. “Biliyorum. Ama artık yalnız değilsin. Ben buradayım. Ve Melek teyze de burada. Ve biz seni kurtaracağız. Söz veriyorum.”</p>
<p>Seda’nın gözleri... bir an... berraklaştı. “Ablam... ben seni seviyorum.”</p>
<p>Selin gülümsedi. “Ben de seni seviyorum. Şimdi... bıçağı bırak. Ve bana sarıl.”</p>
<p>Seda, bir an durdu. Sonra... bıçağı bıraktı. Ve Selin’e sarıldı. Gözyaşları içinde. “Ablam... ablacım... ”</p>
<p>Selin onu sımsıkı tuttu. “Buradayım. Hep buradayım.”</p>
<p>Melek, arkalarında duruyordu. Gözleri dolu. “Seda... ben özür dilerim. Ben seni zehirledim. Ama artık baban için çalışmayacağım. Söz veriyorum.”</p>
<p>Seda, Melek’e baktı. “Sen benim teyzem misin?”</p>
<p>Melek başını salladı. “Evet. Ve senin annen... senin annen Meryem’di. Ve o seni çok sevdi. Ben biliyorum. Çünkü o o seni bana emanet etti. Ölmeden önce.”</p>
<p>Seda gözyaşlarına boğuldu. “Anne... ”</p>
<p>Selin, Seda’yı kucakladı. Ve kuyuya baktı. Karanlığa. Ama bu sefer... karanlıkta bir ışık vardı. Küçük, ama gerçek. Ve Selin, o an, bir şey daha gördü: Kuyunun duvarına kazınmış yeni bir yazı:</p>
<p>“Biz artık buradayız. Ve karanlıkta kalan... kalmayacak.”</p>
<h2 class='chapter'>Bölüm 19: Tedavi̇</h2>
<p>Seda’yı hastaneye kaldırdıklarında, sabah olmak üzereydi. Selin, koridorda beklerken, Melek yanına oturdu. Uzun bir sessizlik oldu. Sonra Melek konuştu:</p>
<p>“Ben yıllarca kaçtım. Baban beni arıyordu. Ama bir gün, Seda’yı gördüm. Hastanede. Ve babanın onu kullandığını fark ettim. O yüzden... o yüzden yaklaştım. Kendimi Ayşe olarak tanıttım. Ve babanın planını öğrendim.”</p>
<p>Selin ona baktı. “Ne planı?”</p>
<p>Melek derin bir nefes aldı. “Baban Seda’yı öldürmek istemiyordu. Onu bir silah olarak kullanmak istiyordu. Seni öldürmek için. Çünkü sen onun en büyük tanığısın. Ve eğer sen ölürsen, baban serbest kalır.”</p>
<p>Selin başını salladı. “Yani Seda’yı zehirlemenin amacı... beni öldürmesi miydi?”</p>
<p>Melek başını öne eğdi. “Evet. Ama ben Seda’ya ilacı vermeye başladığımda, bir şey oldu. Seda bana güvendi. Ve ben ona gerçeği anlatamadım. Çünkü baban beni izliyordu. Ama şimdi biliyorum. Seda benim yeğenim. Ve ben onu korumalıyım.”</p>
<p>Selin, Melek’in elini tuttu. “O zaman... birlikte koruyalım. Ve babamı durduralım.”</p>
<p>Melek başını salladı. “Ama bir sorun var. Baban hapishanede bile çok güçlü. Onun adamları var. Ve eğer biz eğer biz ona karşı gelirsek... ”</p>
<p>Selin gözlerini kıstı. “Biliyorum. Ama artık kanıtımız var. Ve Melek... sen tanık olacaksın. Babanın tüm suçlarına.”</p>
<p>Melek titredi. “Ben yapamam. O adam... o adam beni öldürür.”</p>
<p>Selin ona sıkıca baktı. “O zaman... hep birlikte ölürüz. Ama artık korkmayacağız. Çünkü korku bizi yıllarca susturdu. Ve ben artık susmayacağım.”</p>
<p>Seda, iki gün yoğun bakımda kaldı. Doktorlar, vücudundaki ilacın temizlendiğini ama psikolojik etkilerinin devam edebileceğini söyledi. “Telkin altında kalmış,” dedi doktor. “Ve bu telkin... çok güçlü. Onu kırmak zaman alacak.”</p>
<p>Selin, her gün Seda’nın yanındaydı. Ona kitap okudu, elini tuttu, şarkılar söyledi. Çocukluklarından bahsetti. Kuyudan önceki günlerden. Parkta oynadıkları günlerden. Annelerinin onlara yaptığı kurabiyelerden.</p>
<p>Üçüncü gün, Seda gözlerini açtı. Berrak. Ve gülümsedi.</p>
<p>“Ablam... ben rüya gördüm. Annemi gördüm. Meryem’i. Bana dedi ki... ‘Korkma. Ablan yanında.’”</p>
<p>Selin’in gözleri doldu. “Evet. Ben yanındayım. Ve hep yanında olacağım.”</p>
<p>Seda doğrulmaya çalıştı. “Ablam... ben artık korkmuyorum. O ses... babamın sesi... artık yok. Çünkü ben artık biliyorum. O o sadece bir yalan.”</p>
<p>Selin onu kucakladı. “Biliyorum. Ve şimdi o yalanı bitirme zamanı.”</p>
<h2 class='chapter'>Bölüm 20: Mahkeme</h2>
<p>Baba, yeni bir duruşmaya çıkarıldı. Bu sefer, suçlamalar daha ağırdı: Kasten adam öldürme, çocuk istismarı, zehirleme, tehdit. Ve tanıklar vardı. Selin. Seda. Melek. Ve Kerem.</p>
<p>Mahkeme salonu tıklım tıklımdı. Kasabadan insanlar gelmişti. Merak ediyorlardı. Yıllardır korktukları adam, şimdi karşılarındaydı. Kelepçeli, yorgun, ama gülümsüyordu. Hâlâ gülümsüyordu.</p>
<p>Hâkim, sert bir sesle konuştu: “Sanık, suçlamaları kabul ediyor musunuz?”</p>
<p>Baba başını salladı. “Hayır. Ben masumum. Bu bir komplo. Kızlarım beni yok etmek istiyor. Çünkü onlar hasta.”</p>
<p>Selin, tanık kürsüsüne çıktı. Yemin etti. Sonra babasına baktı. “Sen bir canavarsın. Ve ben senin kızın değilim.”</p>
<p>Baba güldü. “Ama sen benim kanımsın. Meryem’in kızı olsan bile... sen benimsin. Çünkü ben seni büyüttüm.”</p>
<p>Selin başını salladı. “Hayır. Sen beni büyütmedin. Sen beni kuyuya attın. Ve eğer annem olmasaydı... eğer Melek teyzem olmasaydı... ben ölmüş olurdum.”</p>
<p>Baba gözlerini kıstı. “Melek bir yalancı. O o Meryem’in kız kardeşi. O o da bir fahişe.”</p>
<p>Melek, tanık kürsüsüne çıktı. Elleri titriyordu ama sesi sabitti. “Ben Melek Yıldız. Meryem’in ikiz kardeşiyim. Ve bu adam... bu adam kız kardeşimi öldürdü. Ve beni yıllarca tehdit etti. Ben onun için çalıştım. Ama artık ondan korkmuyorum.”</p>
<p>Baba güldü. “Yalan! Hepsi yalan! Bu kadın... bu kadın Meryem’le birlikte beni öldürmeye çalıştı. Ben kendimi savundum.”</p>
<p>Hâkim, Seda’yı çağırdı. Seda, ayağa kalktı. Zorlukla yürüdü. Ama kürsüye çıktığında, dimdik durdu. Babasına baktı. Ve gülümsedi. Acı bir gülümseme.</p>
<p>“Sen benim babamsın. Ama ben seni tanımıyorum. Çünkü sen beni zehirledin. Ve bana yalanlar söyledin. Ve ben artık senin kızın değilim.”</p>
<p>Baba, ona doğru eğildi. “Seda... kızım... sen benimsin. Sen benim kanımsın. Ve o kadın... o kadın seni kandırdı.”</p>
<p>Seda başını salladı. “Hayır. Beni kandıran... sendin. Ve şimdi ben seni mahkûm ediyorum. Kendi kalbimde. Ve bu bana yeter.”</p>
<h2 class='chapter'>Bölüm 21: Yeni̇ Bi̇r Hayat</h2>
<p>Mahkeme, babayı ömür boyu hapse mahkûm etti. Ağırlaştırılmış müebbet. Çünkü cinayetler, çocuk istismarı ve zehirleme... affedilemezdi. Baba, kararı duyduğunda gülümsedi. “Ben yine de kazanacağım. Çünkü ben ölümsüzüm.”</p>
<p>Ama Selin, onu dinlemedi. Seda’nın elini tuttu. Ve mahkemeden çıktı.</p>
<p>Üç ay sonra, Selin ve Seda, kasabadan ayrıldı. İstanbul’a yerleştiler. Küçük bir daire. Ama huzurlu. Seda, üniversiteye başladı. Psikoloji okuyordu. “Ben insanlara yardım etmek istiyorum,” diyordu. “Çünkü ben karanlıktan çıktım. Ve başkalarına da yardım edebilirim.”</p>
<p>Selin ise... yazmaya başladı. Kendi hikâyesini. Kurgu olarak. Ama gerçek. Ve bir gün, bir yayınevi kitabı beğendi. “Karanlıkta Kalan.” Ve yayımlandı. Ve çok satanlar listesine girdi.</p>
<p>Bir gün, postacı bir mektup getirdi. Üzerinde... Meryem’in el yazısı vardı. Selin, zarfı açtı. Elleri titriyordu.</p>
<p>“Selin,</p>
<p>Kızım. Ben yaşıyorum. Ve seni buldum. Ama korktum. Yıllarca. Çünkü baban beni arıyordu. Ama şimdi biliyorum. O o artık hapiste. Ve ben artık korkmuyorum.</p>
<p>Seni görmek istiyorum. Ama eğer istemezsen... anlarım. Çünkü ben seni bıraktım. Kuyuda. Ve sen yıllarca beni suçladın. Haklıydın. Ama ben seni kurtarmak için bıraktım. İnan bana.</p>
<p>Seni seviyorum. Ve hep sevdim.</p>
<p>Annen, Meryem.”</p>
<p>Selin, mektubu Seda’ya uzattı. Seda okudu. Gözyaşları içinde. “Ablam... annem yaşıyor.”</p>
<p>Selin başını salladı. “Evet. Ve onu görmek istiyorum.”</p>
<p>Seda, Selin’e sarıldı. “Ben de.”</p>
<h2 class='chapter'>Bölüm 22: Buluşma</h2>
<p>Meryem’le buluşmak için Trabzon’a gittiler. Selin, yolda boyunca camdan dışarıyı izledi. Ama bu sefer, karanlık yoktu. Sadece... merak. Ve korku. Aynı anda.</p>
<p>Seda, yanında oturuyordu. Elleri kucağında, gözleri kapalı. “Ablam... ya o da bizi istemezse?”</p>
<p>Selin ona baktı. “İstemezse... istemez. Ama biz birbirimizi istiyoruz. Ve bu yeter.”</p>
<p>Seda başını salladı. Ama gözlerinde hâlâ korku vardı.</p>
<p>Buluşma yeri, Trabzon’un eski bir mahallesindeki küçük bir kafe idi. Meryem, köşedeki masada oturuyordu. Selin onu görünce dondu kaldı. Yıllar onu değiştirmişti. Saçları beyazlamış, yüzü çizgilerle dolmuştu. Ama gözleri hâlâ aynıydı. Selin’in gözleri. Aynı renk. Aynı şekil.</p>
<p>Selin, masaya doğru yürüdü. Seda arkasından geldi. Meryem, onları görünce ayağa kalktı. Elleri titriyordu. Gözleri doldu.</p>
<p>“Selin... Seda... ” Sesi çatallıydı. “Kızlarım... ”</p>
<p>Selin durdu. “Ben senin kızın mıyım?”</p>
<p>Meryem başını salladı. Gözyaşları yanaklarından akıyordu. “Evet. Sen benim kızımsın. Ve sen, Seda... sen de benim kızımsın.”</p>
<p>Seda geri çekildi. “Ne? Ben senin kızın değilim. Ben babamın kızıyım.”</p>
<p>Meryem başını salladı. “Hayır. Sen benim kızımsın. Baban seni benden çaldı. Sen doğduğunda... seni alıp kaçtı. Ve bana dedi ki: ‘Eğer peşimden gelirsen, onu öldürürüm.’ Ben korktum. Yıllarca seni aradım. Ama bulamadım.”</p>
<p>Seda’nın dünyası yıkıldı. “Yani ben senin kızınım? Ve babam beni senden mi çaldı?”</p>
<p>Meryem başını salladı. “Evet. Ve sana yalan söyledi. ‘Ayşe’ diye biri yoktu. Ben senin annenim.”</p>
<p>Seda, masaya tutundu. Nefes alamıyordu. Selin, onu tuttu. “Seda... sakin ol. Nefes al.”</p>
<p>Seda başını salladı. Ama gözleri Meryem’e kilitlenmişti. “Sen neden bizi bıraktın? Neden bizi korumadın?”</p>
<p>Meryem gözyaşları içinde cevap verdi: “Ben sizi korumak için bıraktım. Baban bir canavardı. Ve eğer kalırsam... hepimizi öldürecekti. Ben sizi kurtarmak için kaçtım. Ama sonra geri döndüm. Selin’i kuyudan çıkardım. Ama baban onu tekrar kaçırdı. Ve ben yıllarca onu aradım. Ama bulamadım.”</p>
<p>Selin, Meryem’e baktı. “Peki neden şimdi? Neden şimdi ortaya çıktın?”</p>
<p>Meryem derin bir nefes aldı. “Çünkü baban hapiste. Ve artık korkmuyorum. Ama daha da önemlisi... ben hasta olduğumu öğrendim. Kanser. Ve ölmeden önce... sizi görmek istedim. Affedilmek istedim.”</p>
<p>Selin, bir an durdu. Sonra... Meryem’in elini tuttu. “Ben seni affediyorum. Çünkü sen benim annemsin. Ve ben seni seviyorum.”</p>
<p>Meryem gözyaşlarına boğuldu. “Kızım... ”</p>
<p>Seda ise... hâlâ donmuştu. “Ben seni affetmiyorum. Henüz. Ama seninle konuşmak istiyorum. Her şeyi öğrenmek istiyorum.”</p>
<p>Meryem başını salladı. “Tamam. Ne istersen anlatacağım. Çünkü artık saklayacak bir şeyim yok.”</p>
<h2 class='chapter'>Bölüm 23: Anneni̇n Günlüğü</h2>
<p>O gece, Meryem onları kaldığı küçük otel odasına davet etti. Eski bir bavul açtı. İçinde... bir sürü mektup vardı. Ve bir günlük. “Bu sizin için. Yıllarca yazdım. Ama gönderemedim.”</p>
<p>Selin mektupları aldı. Üzerlerinde “Selin’e” ve “Seda’ya” yazıyordu. Onlarca mektup. Yıllar boyunca. Her doğum gününde. Her bayramda. Her önemli günde.</p>
<p>Selin ilk mektubu açtı:</p>
<p>“Sevgili Selin,</p>
<p>Bugün senin doğum günün. On yaşındasın. Ve ben senin yanında olamıyorum. Ama seni düşünüyorum. Her gün. Her saniye. Ve seni koruduğum için... kendimi affetmeye çalışıyorum. Ama yapamıyorum. Çünkü sen kuyuda üç gün kaldın. Ve ben seni kurtaramadım.</p>
<p>Beni affet. Lütfen.</p>
<p>Annen.”</p>
<p>Selin mektubu göğsüne bastırdı. Gözyaşları serbest kaldı. Seda ise kendi mektuplarını okuyordu. Yüzü... ifadesizdi. Sonra... bir mektupta durdu. Ve başını kaldırdı.</p>
<p>“Bu mektupta... ‘Sen doğduğunda, babam seni benden aldı’ diyor. Ama ben senin kızın olduğumu bilmiyordum. Ben hep Ayşe’nin kızı olduğumu sanıyordum.”</p>
<p>Meryem başını salladı. “Biliyorum. Çünkü baban sana öyle söyledi. Ayşe babanın başka bir kurbanıydı. Ama o senin annen değildi. Sen benim kızımsın.”</p>
<p>Seda başını salladı. Ama gözlerinde... bir şey değişmişti. Nefret değil. Ama acı. “Peki neden bana söylemedin? Neden yıllarca sessiz kaldın?”</p>
<p>Meryem gözyaşları içinde cevap verdi: “Çünkü baban beni tehdit ediyordu. ‘Eğer Seda’ya gerçeği söylersen,’ dedi, ‘onu öldürürüm.’ Ben korktum. Ve sessiz kaldım. Ama şimdi biliyorum. Sessizlik ölüm getirir. Ve ben artık susmayacağım.”</p>
<p>Seda, Meryem’e baktı. Uzun bir süre. Sonra... ayağa kalktı. Ve ona sarıldı. “Anne... ben seni affediyorum. Çünkü sen de bir kurbansın. Tıpkı bizim gibi.”</p>
<p>Meryem, Seda’ya sımsıkı sarıldı. “Kızım... sonunda seni buldum.”</p>
<p>Selin de onlara katıldı. Üçü, yıllar sonra ilk kez, birbirlerine sarıldılar. Ve ağladılar. Ama bu sefer... acıdan değil. Rahatlamaktan.</p>
<p>Ertesi gün, Meryem onlara bir şey daha anlattı. “Babanız sadece bir katil değil. O o bir örgütün parçası. Yıllarca insanları öldürdü. Para için. Ve polis onu korudu. Çünkü o o onların muhbiriydi.”</p>
<p>Selin başını salladı. “Biliyorum. Ama artık kanıt var. Ve Melek teyze... o tanık.”</p>
<p>Meryem başını salladı. “Melek benim ikizim. O o hep yanımdaydı. Ama baban onu da tehdit etti. O yüzden... o yüzden Melek sizinle konuşamadı. Ama şimdi o da korkmuyor.”</p>
<p>Selin, Meryem’e baktı. “Anne... sen de tanık olacak mısın? Mahkemede?”</p>
<p>Meryem başını salladı. “Evet. Artık korkmuyorum. Çünkü sizi buldum. Ve sizi kaybetmek istemiyorum.”</p>
<h2 class='chapter'>Bölüm 24: Kuyuya Veda</h2>
<p>Bir ay sonra, baba yeniden mahkemeye çıktı. Bu sefer, Meryem de tanıktı. Ve Melek. Ve Selin. Ve Seda. Ve Kerem. Hepsi aynı şeyi söylüyordu: Baba, bir canavardı.</p>
<p>Mahkeme, babayı ağırlaştırılmış müebbet hapse mahkûm etti. Ve bu sefer... temyiz yoktu. Çünkü kanıtlar su götürmezdi.</p>
<p>Baba, kararı duyduğunda gülümsedi. Ama bu gülümseme... artık zafer değildi. Yenilgiydi. “Ben yine de kazanacağım,” dedi. “Çünkü ben sizin kanınızdayım. Ve kan asla temizlenmez.”</p>
<p>Selin, ona baktı. “Hayır. Sen bizim kanımızda değilsin. Sen sadece bir anı olacaksın. Ve biz seni unutacağız.”</p>
<p>Mahkemeden çıktıklarında, Selin, Seda ve Meryem, doğruca kasabaya gittiler. Kuyuya. Kuyu, hâlâ oradaydı. Ama artık korkutucu değildi. Sadece... eski bir taş yığınıydı.</p>
<p>Selin, kuyunun kenarına bir mektup bıraktı. Seda da. Meryem de.</p>
<p>Selin’in mektubu:</p>
<p>“Seda’ya,</p>
<p>Seni affediyorum. Ve kendimi de. Çünkü ikimiz de kuyudaydık. Ama artık çıktık. Ve bir daha asla dönmeyeceğiz.</p>
<p>Seni seven ablan, Selin.”</p>
<p>Seda’nın mektubu:</p>
<p>“Selin’e,</p>
<p>Beni kurtardığın için teşekkür ederim. Ve beni affettiğin için. Sen dünyanın en iyi ablasısın.</p>
<p>Seni seven kardeşin, Seda.”</p>
<p>Meryem’in mektubu:</p>
<p>“Kızlarıma,</p>
<p>Sizi bulduğum için... ve sizi kaybetmediğim için... çok mutluyum. Beni affettiğiniz için teşekkür ederim. Ve artık huzur içinde ölebilirim.</p>
<p>Sizi seven anneniz, Meryem.”</p>
<p>Üçü, kuyunun başında el ele durdular. Ve karanlığa baktılar. Ama bu sefer... karanlıkta bir şey gördüler. Işık. Küçük, ama gerçek. Ve Selin, o an, bir şey daha gördü: Kuyunun duvarına kazınmış yeni bir yazı:</p>
<p>“Biz artık buradayız. Ve karanlıkta kalan... kalmayacak.”</p>
<h2 class='chapter'>Son</h2>
<p>Aradan bir yıl geçti. Selin, “Karanlıkta Kalan” adlı kitabını yayımladı. Ve kitap... çok sattı. Ama daha da önemlisi... insanlara ulaştı. Kuyuda kalanlara. Sessiz kalanlara. Korkanlara.</p>
<p>Seda, üniversiteyi bitirdi. Psikolog oldu. Ve travma mağdurlarına yardım etmeye başladı. “Ben karanlıktan çıktım,” diyordu herkese. “Ve siz de çıkabilirsiniz.”</p>
<p>Meryem, tedavi gördü. Kanseri yendi. Ve kızlarıyla birlikte, küçük bir sahil kasabasına yerleşti. Her sabah, denizi izliyordu. Ve her akşam, kızlarına sarılıyordu. “Artık korkmuyorum,” diyordu. “Çünkü sizi buldum.”</p>
<p>Kerem, hapisten çıktı. Ve Selin’le evlendi. Küçük bir düğün. Sadece aile. Ve mutluluk.</p>
<p>Melek, kasabada kaldı. Eczacı oldu. Ve her gün, kuyuya bir çiçek bırakıyordu. “Meryem için,” diyordu. “Ve kendim için.”</p>
<p>Ve kuyu hâlâ oradaydı. Ama artık kimse korkmuyordu. Çünkü artık biliyorlardı: Karanlıkta kalan, sadece anılar değildi. Bazen kendimizdik. Ama karanlık her zaman geçerdi. Yeter ki... yeter ki ışığı arayalım.</p>
<h2 class='chapter'>Yazarın Notu</h2>
<p>Sevgili okur,</p>
<p>Bu hikâye, karanlıkta kalanlar için. Sessiz kalanlar için. Korkanlar için. Ve bir gün ışığı bulacak olanlar için.</p>
<p>Unutmayın: En derin kuyu bile... bir gün... güneşi görür.</p>
<p>— Selin Yıldız</p>
